# Reverse proxy Apache — monte le CMS signage sous /signage/
# (http://185.180.206.46/signage/)
#
#   sudo a2enmod proxy proxy_http headers rewrite
#   → coller ce bloc dans le VirtualHost existant, puis : sudo systemctl reload apache2

# /signage (sans slash final) → redirection vers la version avec slash
RedirectMatch 301 ^/signage$ /signage/

ProxyPreserveHost On
ProxyPass        /signage/ http://127.0.0.1:8080/
ProxyPassReverse /signage/ http://127.0.0.1:8080/
