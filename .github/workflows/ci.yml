name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permet de relancer après avoir renseigné les secrets, sans commit vide.
  workflow_dispatch:

jobs:
  # Le service MySQL 8 fait ici ce que l'environnement de développement ne
  # permettait pas : rejouer le schéma sur le moteur réellement visé, et non sur
  # un MariaDB de substitution.
  test:
    name: Schéma, API, front
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marketing_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Appliquer les migrations et les seeds
        env:
          MAR_DB_HOST: 127.0.0.1
          MAR_DB_PORT: '3306'
          MAR_DB_NAME: marketing_test
          MAR_DB_USER: root
          MAR_DB_PASSWORD: root
        run: php db/migrate.php

      - name: Vérifier l'idempotence du runner
        env:
          MAR_DB_HOST: 127.0.0.1
          MAR_DB_PORT: '3306'
          MAR_DB_NAME: marketing_test
          MAR_DB_USER: root
          MAR_DB_PASSWORD: root
        # Un second passage ne doit rien casser : c'est exactement ce que fera
        # chaque déploiement suivant sur une base déjà migrée.
        run: php db/migrate.php

      - name: Vérifier le préfixe mar_
        run: |
          # Une table sans préfixe est une régression : la convention est absolue.
          stray=$(mysql -h 127.0.0.1 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='marketing_test' AND table_name NOT LIKE 'mar\\_%';")
          echo "Objets hors préfixe : $stray"
          test "$stray" -eq 0

      - name: Lint PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests de l'API
        env:
          MAR_DB_HOST: 127.0.0.1
          MAR_DB_PORT: '3306'
          MAR_DB_NAME: marketing_test
          MAR_DB_USER: root
          MAR_DB_PASSWORD: root
        run: php api/tests/smoke.php

      - name: Installer les dépendances front
        run: npm ci

      - name: Typecheck et build
        # Les chemins du front se déduisent de DEPLOY_DIR : le chemin URL est le
        # répertoire de déploiement privé de la racine web. Une variable en moins
        # à tenir, et une occasion de moins de désaccorder les deux.
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/html/marketing' }}
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          URL_PATH=$(printf '%s' "$DEPLOY_DIR" | sed 's|^/var/www/html||; s|/$||')
          export VITE_BASE="${VITE_BASE:-$URL_PATH/}"
          export VITE_API_BASE="${VITE_API_BASE:-$URL_PATH}"
          echo "base=$VITE_BASE  api=$VITE_API_BASE"
          npm run build

      - name: Archiver le build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Déploiement
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    # Conventions reprises de back_office_ws_franchisor, qui se déploie déjà sur
    # ce serveur : mêmes noms de secrets, même méthode. Un dépôt de plus ne doit
    # pas inventer sa propre façon de faire.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      CONFIG_DIR: ${{ vars.CONFIG_DIR || '/var/www/private/marketing' }}
      MAR_DB_NAME: ${{ secrets.MAR_DB_NAME }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/html/marketing' }}

    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Non configuré = on saute, en restant vert. Un dépôt pas encore branché
      # ne doit pas afficher un échec permanent qui finit par être ignoré —
      # c'est la règle déjà appliquée dans notify-landing.yml.
      - name: Vérifier la configuration
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            {
              echo "### Déploiement non configuré"
              echo
              echo "Secrets attendus dans **Settings → Secrets and variables → Actions** :"
              echo "- \`SSH_HOST\` — ex. 185.180.206.46"
              echo "- \`SSH_USER\`"
              echo "- \`SSH_PASSWORD\` (ou \`SSH_KEY\` pour une clé, préférable)"
              echo
              echo "Variables facultatives : \`SSH_PORT\` (défaut 22), \`DEPLOY_DIR\`"
              echo "(défaut \`/var/www/html/marketing\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Déploiement sauté : SSH_HOST ou SSH_USER absent."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SSH_PASSWORD" ] && [ -z "$SSH_KEY" ]; then
            echo "SSH_HOST est défini mais ni SSH_PASSWORD ni SSH_KEY : impossible de s'authentifier."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # La clé prime sur le mot de passe quand les deux existent : le commentaire
      # de deploy.yml dans back_office_ws_franchisor recommande lui-même la clé.
      - name: Préparer l'accès SSH
        if: steps.check.outputs.configured == 'true'
        run: |
          if [ -n "$SSH_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            echo "SSH_OPTS=-p $SSH_PORT -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> "$GITHUB_ENV"
            echo "SSH_CMD=ssh" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            echo "SSH_OPTS=-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> "$GITHUB_ENV"
            echo "SSH_CMD=sshpass -e ssh" >> "$GITHUB_ENV"
          fi

      - name: Préparer le répertoire distant
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_DIR' '$DEPLOY_DIR/api' '$DEPLOY_DIR/db' && command -v rsync >/dev/null || (echo 'rsync manquant sur le serveur'; exit 1)"

      # rsync SANS --delete : le répertoire vit sous une racine web partagée avec
      # d'autres modules, et un DEPLOY_DIR mal réglé effacerait leurs fichiers.
      - name: Publier l'API et les migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          RSYNC="rsync -rltDz --omit-dir-times"
          if [ -n "$SSH_KEY" ]; then PRE=""; else PRE="sshpass -e"; fi
          $PRE $RSYNC --exclude 'tests' -e "ssh $SSH_OPTS" api/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/api/"
          $PRE $RSYNC -e "ssh $SSH_OPTS" db/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/db/"

      # Optionnel : si les secrets de base sont renseignés, le .env est (ré)écrit
      # à chaque déploiement, **au-dessus** de la racine du déploiement — celle-ci
      # est servie par le serveur web, un .env posé dedans serait téléchargeable.
      - name: Écrire la configuration base sur le serveur
        if: steps.check.outputs.configured == 'true' && env.MAR_DB_NAME != ''
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          MAR_DB_HOST: ${{ secrets.MAR_DB_HOST }}
          MAR_DB_PORT: ${{ secrets.MAR_DB_PORT }}
          MAR_DB_NAME: ${{ secrets.MAR_DB_NAME }}
          MAR_DB_USER: ${{ secrets.MAR_DB_USER }}
          MAR_DB_PASSWORD: ${{ secrets.MAR_DB_PASSWORD }}
        run: |
          umask 077
          # Valeurs entre guillemets et échappées : sans cela, un mot de passe
          # bordé d'espaces ou déjà entouré de guillemets serait tronqué à la
          # relecture, et l'authentification échouerait sans indice.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/\"/\\\"/g'; }
          {
            printf 'MAR_DB_HOST="%s"\n'     "$(esc "${MAR_DB_HOST:-127.0.0.1}")"
            printf 'MAR_DB_PORT="%s"\n'     "$(esc "${MAR_DB_PORT:-3306}")"
            printf 'MAR_DB_NAME="%s"\n'     "$(esc "$MAR_DB_NAME")"
            printf 'MAR_DB_USER="%s"\n'     "$(esc "$MAR_DB_USER")"
            printf 'MAR_DB_PASSWORD="%s"\n' "$(esc "$MAR_DB_PASSWORD")"
          } > .env.deploy
          if [ -n "$SSH_KEY" ]; then PRE=""; else PRE="sshpass -e"; fi
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$CONFIG_DIR' && chmod 750 '$CONFIG_DIR'"
          $PRE rsync -a --chmod=600 -e "ssh $SSH_OPTS" .env.deploy "$SSH_USER@$SSH_HOST:$CONFIG_DIR/.env"
          rm -f .env.deploy
          # Pointeur vers la configuration : il ne contient qu'un chemin, aucun
          # secret. Nécessaire parce que le parent de DEPLOY_DIR est ici la racine
          # web elle-même — y poser le .env le rendrait téléchargeable.
          printf '%s\n' "$CONFIG_DIR/.env" > .env-path
          $PRE rsync -a -e "ssh $SSH_OPTS" .env-path "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/api/.env-path"
          rm -f .env-path

      - name: Appliquer les migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_DIR' && php db/migrate.php"

      # Le front en dernier : si une migration échoue, les utilisateurs restent
      # sur la version précédente plutôt que sur une interface sans son schéma.
      - name: Publier le front
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "$SSH_KEY" ]; then PRE=""; else PRE="sshpass -e"; fi
          $PRE rsync -rltDz --omit-dir-times -e "ssh $SSH_OPTS" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      - name: Vérifier la page servie
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          URL_PATH=$(printf '%s' "$DEPLOY_DIR" | sed 's|^/var/www/html||')
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" bash -s << REMOTE
          BASE="http://localhost$URL_PATH"
          echo "== page =="
          curl -s -o /dev/null -w "  %{http_code}  \$BASE/\n" "\$BASE/"
          echo "== API =="
          curl -s -o /dev/null -w "  %{http_code}  \$BASE/api/v1/marketing/references (401 attendu sans jeton)\n" \
            "\$BASE/api/v1/marketing/references"
          REMOTE
