name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permet de relancer après avoir renseigné les secrets, sans commit vide.
  workflow_dispatch:

jobs:
  # Le service MySQL 8 fait ici ce que l'environnement de développement ne
  # permettait pas : rejouer le schéma sur le moteur réellement visé, et non sur
  # un MariaDB de substitution.
  test:
    name: Schéma, API, front
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marketing_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Appliquer les migrations et les seeds
        env:
          MAR_DB_HOST: 127.0.0.1
          MAR_DB_PORT: '3306'
          MAR_DB_NAME: marketing_test
          MAR_DB_USER: root
          MAR_DB_PASSWORD: root
        run: php db/migrate.php

      - name: Vérifier l'idempotence du runner
        env:
          MAR_DB_HOST: 127.0.0.1
          MAR_DB_PORT: '3306'
          MAR_DB_NAME: marketing_test
          MAR_DB_USER: root
          MAR_DB_PASSWORD: root
        # Un second passage ne doit rien casser : c'est exactement ce que fera
        # chaque déploiement suivant sur une base déjà migrée.
        run: php db/migrate.php

      - name: Vérifier le préfixe mar_
        run: |
          # Une table sans préfixe est une régression : la convention est absolue.
          stray=$(mysql -h 127.0.0.1 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='marketing_test' AND table_name NOT LIKE 'mar\\_%';")
          echo "Objets hors préfixe : $stray"
          test "$stray" -eq 0

      - name: Lint PHP
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests de l'API
        env:
          MAR_DB_HOST: 127.0.0.1
          MAR_DB_PORT: '3306'
          MAR_DB_NAME: marketing_test
          MAR_DB_USER: root
          MAR_DB_PASSWORD: root
        run: php api/tests/smoke.php

      - name: Installer les dépendances front
        run: npm ci

      # Deux applications distinctes, donc deux builds. Le rôle est figé à la
      # compilation : chacune n'embarque que sa navigation et ses libellés, et
      # il n'y a plus de bascule à l'écran.
      - name: Typecheck et build — Réseau
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || vars.DEPLOY_PATH || '/var/www/html/marketing' }}
        run: |
          URL_PATH=$(printf '%s' "$DEPLOY_DIR" | sed 's|^/var/www/html||; s|/$||')
          VITE_ROLE=BRAND_ADMIN VITE_BASE="$URL_PATH/" VITE_API_BASE="$URL_PATH" npm run build
          rm -rf dist-reseau && mv dist dist-reseau
          echo "Réseau : base=$URL_PATH/"

      - name: Build — Franchisé
        env:
          DEPLOY_DIR_FRANCHISE: ${{ vars.DEPLOY_DIR_FRANCHISE || '/var/www/html/marketingc' }}
        run: |
          URL_PATH=$(printf '%s' "$DEPLOY_DIR_FRANCHISE" | sed 's|^/var/www/html||; s|/$||')
          VITE_ROLE=FRANCHISEE VITE_BASE="$URL_PATH/" VITE_API_BASE="$URL_PATH" npm run build
          rm -rf dist-franchise && mv dist dist-franchise
          echo "Franchisé : base=$URL_PATH/"

      - name: Archiver les builds
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist-reseau/
            dist-franchise/
          retention-days: 7

  deploy:
    name: Déploiement
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    # Conventions reprises de back_office_ws_franchisor, qui se déploie déjà sur
    # ce serveur : mêmes noms de secrets, même méthode. Un dépôt de plus ne doit
    # pas inventer sa propre façon de faire.
    # Les deux conventions de nommage sont acceptées : celle de
    # back_office_ws_franchisor (SSH_*) et celle que ce dépôt utilisait avant
    # d'être aligné (DEPLOY_*). Le déploiement ne doit pas échouer sur un nom.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.DEPLOY_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || secrets.DEPLOY_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || secrets.DEPLOY_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      CONFIG_DIR: ${{ vars.CONFIG_DIR || '/var/www/private/marketing' }}
      MAR_DB_NAME: ${{ secrets.MAR_DB_NAME }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || vars.DEPLOY_PATH || '/var/www/html/marketing' }}
      DEPLOY_DIR_FRANCHISE: ${{ vars.DEPLOY_DIR_FRANCHISE || '/var/www/html/marketingc' }}

    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Non configuré = on saute, en restant vert. Un dépôt pas encore branché
      # ne doit pas afficher un échec permanent qui finit par être ignoré —
      # c'est la règle déjà appliquée dans notify-landing.yml.
      - name: Vérifier la configuration
        id: check
        run: |
          # Inventaire lisible dans le résumé du run : uniquement des noms et
          # des présences, jamais une valeur.
          {
            echo "### Configuration du déploiement"
            echo
            echo "| Élément | État |"
            echo "|---|---|"
            printf '| `SSH_HOST` (ou `DEPLOY_HOST`) | %s |\n'         "$([ -n "$SSH_HOST" ] && echo 'présent' || echo '**absent**')"
            printf '| `SSH_USER` (ou `DEPLOY_USER`) | %s |\n'         "$([ -n "$SSH_USER" ] && echo 'présent' || echo '**absent**')"
            printf '| `SSH_PASSWORD` / `SSH_KEY` | %s |\n'            "$([ -n "$SSH_PASSWORD" ] || [ -n "$SSH_KEY" ] && echo 'présent' || echo '**absent**')"
            printf '| `SSH_KNOWN_HOSTS` | %s |\n'                      "$([ -n "$SSH_KNOWN_HOSTS" ] && echo 'présent — empreinte vérifiée' || echo 'absent — vérification désactivée')"
            printf '| `DEPLOY_DIR` | `%s` |\n'                        "$DEPLOY_DIR"
            printf '| `CONFIG_DIR` | `%s` |\n'                        "$CONFIG_DIR"
            printf '| `MAR_DB_NAME` | %s |\n'                         "$([ -n "$MAR_DB_NAME" ] && echo 'présent — le .env sera écrit' || echo 'absent — .env laissé en place')"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            {
              echo "### Déploiement non configuré"
              echo
              echo "Secrets attendus dans **Settings → Secrets and variables → Actions** :"
              echo "- \`SSH_HOST\` — ex. 185.180.206.46  *(ou \`DEPLOY_HOST\`)*"
              echo "- \`SSH_USER\`  *(ou \`DEPLOY_USER\`)*"
              echo "- \`SSH_PASSWORD\` *(ou \`DEPLOY_PASSWORD\`, ou \`SSH_KEY\`/\`DEPLOY_SSH_KEY\`)*"
              echo
              echo "Variables facultatives : \`SSH_PORT\` (défaut 22), \`DEPLOY_DIR\`"
              echo "(défaut \`/var/www/html/marketing\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Déploiement sauté : SSH_HOST ou SSH_USER absent."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SSH_PASSWORD" ] && [ -z "$SSH_KEY" ]; then
            echo "SSH_HOST est défini mais ni SSH_PASSWORD ni SSH_KEY : impossible de s'authentifier."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # La clé prime sur le mot de passe quand les deux existent : le commentaire
      # de deploy.yml dans back_office_ws_franchisor recommande lui-même la clé.
      - name: Préparer l'accès SSH
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          install -m 700 -d ~/.ssh

          # L'empreinte de l'hôte, quand elle est fournie, évite d'accepter
          # aveuglément n'importe quel serveur répondant à cette adresse.
          HOST_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts

            # Une empreinte fournie ne suffit pas : encore faut-il qu'elle couvre
            # cet hôte. Sinon ssh refuse la connexion pour une clé manquante, ce
            # qui ressemble à un refus d'authentification et envoie chercher le
            # problème au mauvais endroit.
            if ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
              HOST_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
              echo "Empreinte d'hôte trouvée : vérification activée."
            else
              # On avertit fort plutôt que de bloquer le déploiement sur un secret
              # incomplet : sans entrée utilisable, on n'est pas plus protégé en
              # échouant qu'en continuant.
              echo "::warning title=Empreinte d'hôte inutilisable::SSH_KNOWN_HOSTS ne contient aucune entrée pour cet hôte — vérification désactivée. Régénérez-la avec : ssh-keyscan -t rsa,ecdsa,ed25519 <hôte>"
              echo "Empreinte fournie mais sans entrée pour cet hôte : vérification désactivée."
            fi
          else
            echo "Pas d'empreinte d'hôte : vérification désactivée (ajoutez SSH_KNOWN_HOSTS)."
          fi

          # sshpass est installé d'office : la clé peut se révéler inutilisable et
          # le mot de passe devenir le seul recours.
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          CHOSEN=""
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            KEY_OPTS="-p $SSH_PORT -i $HOME/.ssh/id_deploy $HOST_OPTS"

            # Une clé peut authentifier sans rien permettre : c'est le cas d'une
            # clé à commande forcée (`command=` dans authorized_keys), qui ignore
            # la commande demandée et sort en silence. On l'écarte en vérifiant
            # qu'un simple echo revient.
            if probe=$(ssh $KEY_OPTS -o BatchMode=yes -o ConnectTimeout=15 \
                         "$SSH_USER@$SSH_HOST" 'echo SSH_PROBE_OK' 2>&1) \
               && [ "${probe#*SSH_PROBE_OK}" != "$probe" ]; then
              CHOSEN=key
              echo "SSH_OPTS=$KEY_OPTS" >> "$GITHUB_ENV"
              echo "SSH_CMD=ssh" >> "$GITHUB_ENV"
              echo "Authentification par clé : opérationnelle."
            else
              echo "::warning title=Clé SSH inutilisable::La clé authentifie mais n'exécute aucune commande — typiquement une clé à commande forcée. Repli sur SSH_PASSWORD."
              echo "Clé refusée pour l'exécution de commandes."
            fi
          fi

          if [ -z "$CHOSEN" ]; then
            if [ -z "$SSH_PASSWORD" ]; then
              echo "::error title=Aucune authentification exploitable::La clé n'exécute pas de commande et SSH_PASSWORD n'est pas défini. Ajoutez SSH_PASSWORD, ou installez une clé de déploiement sans commande forcée dans authorized_keys."
              exit 1
            fi
            echo "SSH_OPTS=-p $SSH_PORT $HOST_OPTS" >> "$GITHUB_ENV"
            echo "SSH_CMD=sshpass -e ssh" >> "$GITHUB_ENV"
            echo "Authentification par mot de passe."
          fi

      - name: Préparer le répertoire distant
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # Chaque contrôle laisse une trace : la version précédente enchaînait
          # mkdir et la détection de rsync avec &&, et un échec sortait
          # silencieusement — impossible de savoir lequel des deux avait cédé.
          # `which` en secours de `command -v`, que tous les shells n'ont pas.
          out=$($SSH_CMD $SSH_OPTS -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "
            echo \"USER=\$(id -un 2>/dev/null)\"
            if mkdir -p '$DEPLOY_DIR' '$DEPLOY_DIR/api' '$DEPLOY_DIR/db' '$DEPLOY_DIR_FRANCHISE' '$DEPLOY_DIR_FRANCHISE/api' 2>&1; then
              echo MKDIR_OK
            else
              echo MKDIR_FAIL
            fi
            if [ -w '$DEPLOY_DIR' ]; then echo WRITABLE; else echo NOT_WRITABLE; fi
            r=\$(command -v rsync 2>/dev/null || which rsync 2>/dev/null || echo '')
            if [ -n \"\$r\" ]; then echo \"RSYNC=\$r\"; else echo RSYNC_MISSING; fi
            p=\$(command -v php 2>/dev/null || which php 2>/dev/null || echo '')
            if [ -n \"\$p\" ]; then echo \"PHP=\$p\"; else echo PHP_MISSING; fi
          " 2>&1) || true

          printf '%s\n' "$out"
          {
            echo "### Diagnostic serveur"
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          case "$out" in
            *MKDIR_FAIL*|*NOT_WRITABLE*)
              echo "::error title=Droits insuffisants::L'utilisateur SSH ne peut pas écrire dans $DEPLOY_DIR. Sur le serveur : chown -R <utilisateur>:www-data $DEPLOY_DIR"
              fail=1 ;;
          esac
          case "$out" in
            *RSYNC_MISSING*)
              echo "::error title=rsync absent::rsync introuvable pour l'utilisateur SSH. Sur le serveur : apt-get install -y rsync"
              fail=1 ;;
          esac
          case "$out" in
            *PHP_MISSING*)
              echo "::error title=php absent::php introuvable pour l'utilisateur SSH — les migrations ne pourront pas s'exécuter."
              fail=1 ;;
          esac
          case "$out" in
            *MKDIR_OK*) ;;
            *)
              echo "::error title=Commande distante muette::Aucun marqueur reçu. Sortie brute : $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-350)"
              fail=1 ;;
          esac

          exit $fail

      # rsync SANS --delete : le répertoire vit sous une racine web partagée avec
      # d'autres modules, et un DEPLOY_DIR mal réglé effacerait leurs fichiers.
      - name: Publier l'API et les migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          RSYNC="rsync -rltDz --omit-dir-times"
          if [ -n "$SSH_KEY" ]; then PRE=""; else PRE="sshpass -e"; fi
          # Filet : l'étape précédente crée ces répertoires, mais un rsync vers
          # une destination absente échoue sur un code 11 laconique — mieux vaut
          # s'en assurer ici que de rediagnostiquer une erreur d'E/S.
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_DIR/api' '$DEPLOY_DIR/db' '$DEPLOY_DIR_FRANCHISE/api'"
          $PRE $RSYNC --exclude 'tests' -e "ssh $SSH_OPTS" api/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/api/"
          $PRE $RSYNC -e "ssh $SSH_OPTS" db/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/db/"
          # L'API est publiée dans les deux répertoires : chacun reste autonome,
          # et redéployer l'un ne peut pas casser l'autre.
          $PRE $RSYNC --exclude 'tests' -e "ssh $SSH_OPTS" api/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR_FRANCHISE/api/"

      # Optionnel : si les secrets de base sont renseignés, le .env est (ré)écrit
      # à chaque déploiement, **au-dessus** de la racine du déploiement — celle-ci
      # est servie par le serveur web, un .env posé dedans serait téléchargeable.
      - name: Écrire la configuration base sur le serveur
        if: steps.check.outputs.configured == 'true' && env.MAR_DB_NAME != ''
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          MAR_DB_HOST: ${{ secrets.MAR_DB_HOST }}
          MAR_DB_PORT: ${{ secrets.MAR_DB_PORT }}
          MAR_DB_NAME: ${{ secrets.MAR_DB_NAME }}
          MAR_DB_USER: ${{ secrets.MAR_DB_USER }}
          MAR_DB_PASSWORD: ${{ secrets.MAR_DB_PASSWORD }}
        run: |
          umask 077
          # Valeurs entre guillemets et échappées : sans cela, un mot de passe
          # bordé d'espaces ou déjà entouré de guillemets serait tronqué à la
          # relecture, et l'authentification échouerait sans indice.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/\"/\\\"/g'; }
          {
            printf 'MAR_DB_HOST="%s"\n'     "$(esc "${MAR_DB_HOST:-127.0.0.1}")"
            printf 'MAR_DB_PORT="%s"\n'     "$(esc "${MAR_DB_PORT:-3306}")"
            printf 'MAR_DB_NAME="%s"\n'     "$(esc "$MAR_DB_NAME")"
            printf 'MAR_DB_USER="%s"\n'     "$(esc "$MAR_DB_USER")"
            printf 'MAR_DB_PASSWORD="%s"\n' "$(esc "$MAR_DB_PASSWORD")"
          } > .env.deploy
          if [ -n "$SSH_KEY" ]; then PRE=""; else PRE="sshpass -e"; fi
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$CONFIG_DIR' && chmod 750 '$CONFIG_DIR'"
          # 640 et groupe www-data, pas 600 : le fichier est écrit par le compte
          # de déploiement mais lu par PHP sous www-data. En 600 appartenant à
          # root, l'API ne peut pas l'ouvrir — elle perd les identifiants de base
          # sans qu'aucune étape n'échoue, puisque rien ne les lit avant le
          # premier appel qui touche la base.
          $PRE rsync -a --chmod=640 -e "ssh $SSH_OPTS" .env.deploy "$SSH_USER@$SSH_HOST:$CONFIG_DIR/.env"
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "chgrp www-data '$CONFIG_DIR/.env' 2>/dev/null || true; chmod 640 '$CONFIG_DIR/.env'; chmod 750 '$CONFIG_DIR'; chgrp www-data '$CONFIG_DIR' 2>/dev/null || true"
          rm -f .env.deploy
          # Pointeur vers la configuration : il ne contient qu'un chemin, aucun
          # secret. Nécessaire parce que le parent de DEPLOY_DIR est ici la racine
          # web elle-même — y poser le .env le rendrait téléchargeable.
          # 644, et non le 600 qu'imposerait l'umask de cette étape : le pointeur
          # ne contient qu'un chemin, mais PHP tourne sous www-data et doit
          # pouvoir le lire. En 600 appartenant au compte de déploiement, il
          # devient illisible — la configuration paraît alors introuvable alors
          # que le .env lui-même est parfaitement accessible.
          printf '%s\n' "$CONFIG_DIR/.env" > .env-path
          $PRE rsync -a --chmod=644 -e "ssh $SSH_OPTS" .env-path "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/api/.env-path"
          $PRE rsync -a --chmod=644 -e "ssh $SSH_OPTS" .env-path "$SSH_USER@$SSH_HOST:$DEPLOY_DIR_FRANCHISE/api/.env-path"
          $SSH_CMD $SSH_OPTS "$SSH_USER@$SSH_HOST" "chmod 644 '$DEPLOY_DIR/api/.env-path' '$DEPLOY_DIR_FRANCHISE/api/.env-path'"
          rm -f .env-path

      - name: Appliquer les migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # Sortie capturée : sans cela l'étape ne laissait qu'un code de retour,
          # et un 255 de ssh ne dit rien de ce que la migration a rencontré.
          set +e
          out=$($SSH_CMD $SSH_OPTS -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            cd '$DEPLOY_DIR' 2>/dev/null || { echo 'CD_FAIL'; exit 90; }
            command -v php >/dev/null 2>&1 || { echo 'PHP_MISSING'; exit 91; }
            # Résumé compact : une annotation est courte, et « installez
            # php-mysql » ne suffit pas quand plusieurs versions de PHP
            # cohabitent et que le paquet a été posé sur la mauvaise.
            # Plusieurs versions de PHP peuvent cohabiter et le pilote MySQL n'être
            # posé que sur l'une d'elles. On retient la première qui sait réellement
            # se connecter, au lieu de supposer que `php` est la bonne.
            P=''; for c in php php8.3 php8.2 php8.1 php8.0; do command -v \$c >/dev/null 2>&1 || continue; \$c -m 2>/dev/null | grep -qi pdo_mysql && { P=\$c; break; }; done
            a=\$(ls /usr/bin/php* 2>/dev/null | tr '\\n' ','); echo \"DIAG php=\$(php -r 'echo PHP_VERSION;' 2>/dev/null) retenu=\${P:-aucun} autres=\$a\"
            [ -n "\$P" ] || { echo 'PDO_MYSQL_MISSING'; exit 93; }
            [ -f db/migrate.php ] || { echo 'MIGRATE_ABSENT'; exit 92; }
            \$P db/migrate.php 2>&1
          " 2>&1)
          rc=$?
          set -e

          printf '%s\n' "$out"
          {
            echo "### Migrations (code $rc)"
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $rc -ne 0 ]; then
            case "$out" in
              *PHP_MISSING*)        hint="php introuvable pour l'utilisateur SSH : apt-get install -y php-cli php-mysql" ;;
              *PDO_MYSQL_MISSING*)  hint="aucun interpréteur PHP n'a pdo_mysql. Installez-le pour la version voulue, ex. apt-get install -y php8.3-mysql" ;;
              *MIGRATE_ABSENT*)     hint="db/migrate.php n'est pas arrivé sur le serveur" ;;
              *CD_FAIL*)            hint="$DEPLOY_DIR inaccessible" ;;
              *Access\ denied*)     hint="MySQL refuse les identifiants du .env" ;;
              *)                    hint="voir la sortie ci-dessus" ;;
            esac
            diag=$(printf '%s\n' "$out" | grep '^DIAG' | head -1)
            rest=$(printf '%s\n' "$out" | grep -v '^DIAG' | grep -viE 'permanently added' | tr '\n' ' ' | cut -c1-250)
            echo "::error title=Migrations en échec::$hint | $diag | $rest"
            exit 1
          fi

      # Le front en dernier : si une migration échoue, les utilisateurs restent
      # sur la version précédente plutôt que sur une interface sans son schéma.
      - name: Publier le front
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "$SSH_KEY" ]; then PRE=""; else PRE="sshpass -e"; fi
          $PRE rsync -rltDz --omit-dir-times -e "ssh $SSH_OPTS" dist-reseau/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"
          $PRE rsync -rltDz --omit-dir-times -e "ssh $SSH_OPTS" dist-franchise/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR_FRANCHISE/"

      - name: Vérifier la page servie
        if: steps.check.outputs.configured == 'true'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # Une étape qui se contente d'afficher des codes passe au vert quoi
          # qu'il arrive : elle donne l'illusion d'un contrôle. Chaque code est
          # donc comparé à ce qu'on attend.
          URL_PATH=$(printf '%s' "$DEPLOY_DIR" | sed 's|^/var/www/html||; s|/$||')
          out=$($SSH_CMD $SSH_OPTS -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            B=http://localhost$URL_PATH
            for p in '/' '/api/v1/marketing/session' '/api/v1/marketing/references' '/.env' '/db/migrate.php'; do
              printf '%s %s\n' \"\$p\" \"\$(curl -s -o /dev/null -w '%{http_code}' \"\$B\$p\")\"
            done
          " 2>&1 | grep -v 'Permanently added')

          printf '%s\n' "$out"
          { echo "### Contrôles HTTP"; echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          code() { printf '%s\n' "$out" | awk -v p="$1" '$1==p {print $2}'; }
          fail=0
          check() {
            got=$(code "$1")
            case " $2 " in
              *" $got "*) echo "  ok   $1 → $got" ;;
              *) echo "  NON  $1 → $got (attendu : $2)"
                 echo "::error title=Contrôle HTTP::$1 répond $got, attendu $2 — $3"
                 fail=1 ;;
            esac
          }
          # 401 sur une route protégée est le bon résultat : l'API est joignable
          # et refuse l'accès. Un 404 dirait que la réécriture ne s'applique pas.
          check '/'                              '200'     "le front n'est pas servi"
          check '/api/v1/marketing/session'      '200'     "la réécriture vers api/public/index.php ne s'applique pas"

          # /session expose config_found : sans ce contrôle, un fichier de
          # configuration jamais lu passe inaperçu jusqu'au premier écran qui
          # interroge la base, et se manifeste alors en 500 sans lien apparent.
          cfg=$($SSH_CMD $SSH_OPTS -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "curl -s http://localhost$URL_PATH/api/v1/marketing/session" 2>/dev/null | grep -o '\"config_found\":[a-z]*' || true)
          echo "  $cfg"
          case "$cfg" in
            *false*)
              echo "::error title=Configuration illisible::L'API ne trouve aucun fichier de configuration. Vérifiez que api/.env-path et le .env sont lisibles par www-data."
              fail=1 ;;
          esac
          check '/api/v1/marketing/references'   '200 401' "l'API ne répond pas correctement"
          check '/.env'                          '403 404' "le fichier de configuration est exposé"
          check '/db/migrate.php'                '403 404' "les migrations sont exposées"

          # La vue Franchisé est une application à part entière : elle mérite les
          # mêmes contrôles, sinon un déploiement à moitié cassé passerait vert.
          URL_F=$(printf '%s' "$DEPLOY_DIR_FRANCHISE" | sed 's|^/var/www/html||; s|/$||')
          outf=$($SSH_CMD $SSH_OPTS -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            B=http://localhost$URL_F
            for p in '/' '/api/v1/marketing/session'; do
              printf '%s %s\n' \"\$p\" \"\$(curl -s -o /dev/null -w '%{http_code}' \"\$B\$p\")\"
            done
          " 2>&1 | grep -v 'Permanently added')
          echo "  franchisé :"; printf '%s\n' "$outf" | sed 's/^/    /'
          codef() { printf '%s\n' "$outf" | awk -v p="$1" '$1==p {print $2}'; }
          for pair in "/:200" "/api/v1/marketing/session:200"; do
            p=${pair%:*}; want=${pair##*:}; got=$(codef "$p")
            if [ "$got" != "$want" ]; then
              echo "::error title=Vue Franchisé::$p répond $got, attendu $want"
              fail=1
            fi
          done
          exit $fail
