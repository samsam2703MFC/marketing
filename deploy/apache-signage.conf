# Reverse proxy Apache — monte le CMS signage sous /pwa_consultant/signage/
# (http://185.180.206.46/pwa_consultant/signage/)
#
#   sudo a2enmod proxy proxy_http headers rewrite
#   → coller ce bloc dans le VirtualHost existant, puis : sudo systemctl reload apache2

# /pwa_consultant/signage (sans slash final) → redirection vers la version avec slash
RedirectMatch 301 ^/pwa_consultant/signage$ /pwa_consultant/signage/

ProxyPreserveHost On
ProxyPass        /pwa_consultant/signage/ http://127.0.0.1:8080/
ProxyPassReverse /pwa_consultant/signage/ http://127.0.0.1:8080/
