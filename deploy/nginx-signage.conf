# Reverse proxy Nginx — monte le CMS signage sous /pwa_consultant/signage/
# (http://185.180.206.46/pwa_consultant/signage/)
# → coller dans le bloc server {} existant, puis : sudo nginx -s reload

location = /pwa_consultant/signage { return 301 /pwa_consultant/signage/; }

location /pwa_consultant/signage/ {
    proxy_pass http://127.0.0.1:8080/;   # le slash final retire le préfixe
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    client_max_body_size 16m;            # photos importées (dataURL)
}
