components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mar_session
      description: Session ouverte par les identifiants de l'ERP (réseau seul).
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Jeton de service entre portails (`erp_jeton_service` d'erp_cles).

  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    shopId: { name: shopId, in: path, required: true, schema: { type: integer }, description: Identifiant de caisse ERP de la boutique. }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    perPage: { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    sort: { name: sort, in: query, schema: { type: string, enum: [updatedAt, -updatedAt, createdAt, -createdAt, title, -title], default: -updatedAt } }

  responses:
    OrderForm:
      description: Le bon de commande d'une version.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/OrderForm' } } }
    OrderConditions:
      description: Les conditions du bon de commande d'une boutique.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/OrderConditions' } } }
    Unauthenticated:
      description: Sans identité (forme commune du routeur du module, §3.2 du registre).
      content:
        application/json:
          schema: { type: object, properties: { status: { type: string }, description: { type: string } } }
    Error:
      description: Erreur au format du standard.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Catalogue:
      description: Un catalogue.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Catalogue' } } }
    CatalogueList:
      description: Une page de catalogues.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Catalogue' } } } }
    Document:
      description: Une version mise en pages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Document' } } }
    WebshopProducts:
      description: Le webshop des boutiques.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/WebshopProducts' } } }
    ShopProducts:
      description: Le webshop d'une boutique, à ses prix.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            nameNl: { type: string }
                            imageUrl: { type: [string, 'null'] }
                            categoryId: { type: [integer, 'null'] }
                            gammes: { type: array, items: { type: integer } }
                            priceCents: { type: [integer, 'null'], description: Prix du webshop de la boutique (à défaut son prix au comptoir). }
                            shopPriceCents: { type: [integer, 'null'], description: Prix au comptoir (pour signaler un écart). }
                            availability: { $ref: '#/components/schemas/Availability' }
                      offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
                      offersError: { type: [string, 'null'] }
                      categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
                      offWebshopCategories: { type: array, description: v1.21 — voir WebshopProducts., items: { type: object, properties: { name: { type: string }, nameNl: { type: string }, products: { type: integer } } } }
                      gammes: { type: array, items: { $ref: '#/components/schemas/Gamme' } }
                      shops: { type: array, items: { $ref: '#/components/schemas/ShopRead' } }
                      layouts: { type: array, items: { $ref: '#/components/schemas/Layout' } }
                      templates: { type: array, items: { $ref: '#/components/schemas/Template' } }
                      headers: { type: array, items: { $ref: '#/components/schemas/Header' } }
                      fillers: { type: array, items: { type: string, enum: [photo, illustration] } }
                      pageCounts: { type: array, items: { $ref: '#/components/schemas/PageCount' } }
    BrandPages:
      description: v1.10 — Les 4 pages de la marque d'un catalogue.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/BrandPages' } } }
    Charter:
      description: La Charte des catalogues.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Charter' } } }

  schemas:
    OrderConditionsWrite:
      type: object
      additionalProperties: false
      properties:
        minDelay: { oneOf: [{ type: object, required: [value, unit], properties: { value: { type: integer, minimum: 1, description: '720 h ou 60 jours au plus' }, unit: { type: string, enum: [hours, days] } } }, { type: 'null' }] }
        depositPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        holidayDeadlines: { type: array, maxItems: 10, items: { type: object, required: [for, until], properties: { for: { type: string, format: date }, until: { type: string, format: date, description: 'Au plus tard le jour de la fête.' } } } }
        pickup: { type: boolean, default: true }
        delivery: { type: object, properties: { enabled: { type: boolean }, radiusKm: { type: [integer, 'null'], minimum: 1, maximum: 200 }, feeCents: { type: [integer, 'null'], minimum: 0 } } }
        note: { type: object, properties: { fr: { type: string, maxLength: 160 }, nl: { type: string, maxLength: 160 } }, description: 'Une ligne ; NL vide : le français.' }
    OrderConditions:
      allOf:
        - $ref: '#/components/schemas/OrderConditionsWrite'
        - type: object
          properties:
            shopId: { type: integer }
            configured: { type: boolean, description: 'false : rien de réglé (le bon imprime le cadre vide).' }
            updatedAt: { type: [string, 'null'], format: date-time }
    OrderForm:
      type: object
      description: 'Clés toujours dans cet ordre. Libellés fixes FR / NL dans `labels`.'
      properties:
        catalogue: { type: object, properties: { id: { type: integer }, title: { type: string }, format: { type: string } } }
        version: { type: object, properties: { lang: { type: string, enum: [fr, nl] }, shop: { type: [object, 'null'], description: '{id, name, address, phone, hours, holidayHours} ; null : version générale' } } }
        charter: { type: object, properties: { logoUrl: { type: [string, 'null'] }, colors: { type: object } } }
        qr: { type: [object, 'null'], properties: { url: { type: string }, host: { type: [string, 'null'] }, label: { type: string }, sub: { type: string } } }
        categories:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              pages: { type: array, items: { type: integer } }
              items: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, format: { type: [string, 'null'] }, priceCents: { type: [integer, 'null'] }, oldPriceCents: { type: [integer, 'null'] }, promo: { type: [object, 'null'] }, currency: { type: string } } } }
              footer: { type: [string, 'null'] }
              delay: { type: [object, 'null'], properties: { hours: { type: integer }, text: { type: string }, source: { type: string, enum: [catalogue, boutique] } } }
        offers: { type: array, items: { type: object, properties: { id: { type: string }, type: { type: string }, name: { type: string }, badge: { type: string }, deal: { type: [string, 'null'] }, contents: { type: string }, period: { type: [string, 'null'] }, priceCents: { type: [integer, 'null'] }, oldPriceCents: { type: [integer, 'null'] }, currency: { type: string }, pages: { type: array, items: { type: integer } } } } }
        counts: { type: object, properties: { products: { type: integer }, offers: { type: integer }, catalogueLeadHours: { type: [integer, 'null'], description: 'Le plus long délai du catalogue, en heures.' } } }
        pages: { type: array, items: { type: integer } }
        conditions: { type: object, properties: { configured: { type: boolean }, title: { type: string }, by: { type: [string, 'null'] }, lines: { type: array, items: { type: string } }, depositPct: { type: [integer, 'null'] }, pickup: { type: boolean }, delivery: { type: boolean }, updatedAt: { type: [string, 'null'] } } }
        labels: { type: object, additionalProperties: { type: string } }
        warnings: { type: array, items: { type: object } }
    EnvelopeOk:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            pagination:
              type: object
              properties: { page: { type: integer }, perPage: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    EnvelopeError:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, AUTH_TOKEN_MISSING, AUTH_TOKEN_INVALID, PERM_ROLE_REQUIRED, RESOURCE_NOT_FOUND, DEPENDENCY_UNAVAILABLE, CATALOGUE_PRODUCT_NOT_SOLD, CATALOGUE_PAGES_NOT_EMPTY]
            message: { type: string }
            details: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
        meta: { type: object, properties: { requestId: { type: string } } }
    Status: { type: string, enum: [brouillon, pret, imprime] }
    PageCount: { type: integer, enum: [8, 10, 12, 14, 16], description: 'Pages du catalogue, toujours un nombre pair de 8 à 16 (« rajouter une page, c''est toujours par 2 »), dont 4 de la marque (1, 2, avant-dernière, dernière). Autre valeur : 422.' }
    Layout: { type: string, enum: [vedette, grille, liste, mosaique, pleine, presentation, presentation_liste], description: 'vedette : 1 + 4 produits ; grille : 2 × 3 ; liste : 12 avec prix ; mosaique : grandes vignettes 2 × 2 (4 produits) ; pleine : un seul produit sur la page, et sa promotion (v1.8) ; presentation : la page d''une gamme (illustration, nom, texte), sans produit ; presentation_liste : la même avec les 8 premiers produits de la gamme et leurs prix.' }
    Header: { type: string, enum: [titre, bandeau, grande], description: 'En-tête d''une page de produits et illustration de sa catégorie : titre (titre et petit pictogramme, le défaut) · bandeau (bandeau de la couleur principale, illustration en blanc) · grande (grande illustration en haut de page, puis le titre). Indépendant du gabarit.' }
    Template: { type: string, enum: [A, B, C], description: 'Variante de gabarit. Pages de produits : A classique (fond papier, titre centré), B bandeau (bandeau de la couleur principale), C épuré (fond blanc, titre à gauche). Présentations : A illustration, B pleine couleur, C photo pleine.' }
    DocFiller:
      type: [object, 'null']
      description: La place libre d'une page de produits, remplie (null sinon, ou quand la page est pleine).
      properties:
        kind: { type: string, enum: [photo, illustration] }
        imageUrl: { type: [string, 'null'], description: Photo de la médiathèque (ou de la gamme quand elle n'a pas de dessin). }
        drawing: { type: [string, 'null'], description: 'Dessin livré avec le module, chemin relatif (img/print/noel.png, img/croissant.png).' }
        drawingUrl: { type: [string, 'null'], description: Le même, en adresse absolue. }
    ProductRow:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: integer, description: Identifiant du produit dans TFBuddy (webshop). }
        'on': { type: boolean, default: true }
    DocPresText: { type: object, properties: { text: { type: string }, font: { type: string }, size: { type: integer }, weight: { type: string }, color: { type: string }, align: { type: string } } }
    PageRow:
      type: object
      additionalProperties: false
      required: [layout]
      properties:
        layout: { $ref: '#/components/schemas/Layout' }
        category: { type: [integer, 'null'], description: 'Catégorie du webshop ; null : « Notre sélection » (les suivants, toutes catégories). Ignorée (rangée null) pour une présentation.' }
        product: { type: [integer, 'null'], minimum: 1, description: 'v1.8 — Seulement avec `layout: pleine` : le produit du webshop que la page montre seul, réservé à elle avec sa promotion ; absent = le premier de sa catégorie. Ailleurs : 422.' }
        template: { $ref: '#/components/schemas/Template' }
        gamme: { type: [integer, 'null'], description: 'Gamme du webshop (active) : obligatoire pour une présentation ; sur une page de produits, seulement les produits de cette gamme.' }
        text: { type: string, maxLength: 400, description: 'Texte d''une présentation (ignoré ailleurs) ; vide = rien.' }
        textNl: { type: string, maxLength: 400, description: 'Le même en néerlandais ; vide = le français, dit (NL_TEXT_MISSING).' }
        filler: { type: [string, 'null'], enum: [photo, illustration, null], description: 'Place libre d''une page de produits pas pleine (ignorée sur une présentation).' }
        fillerMediaId: { type: [integer, 'null'], description: 'Avec `filler: photo` : une image de la médiathèque, pas archivée ; pour une boutique, du réseau ou d''elle-même.' }
        header: { $ref: '#/components/schemas/Header' }
        script: { type: boolean, default: false, description: 'La catégorie en lettres manuscrites (police de la marque) ; autre valeur que booléen : 422. Rangé seulement quand vrai.' }
    CatalogueCreate:
      type: object
      additionalProperties: false
      required: [title, source]
      properties:
        title: { type: string, maxLength: 160 }
        support: { $ref: '#/components/schemas/Support' }
        brochureTemplate: { $ref: '#/components/schemas/BrochureTemplate' }
        brochureTexts: { allOf: [{ $ref: '#/components/schemas/BrochureTexts' }], description: 'v1.19 — leaflet ou dépliant seulement.' }
        fromBrochure: { $ref: '#/components/schemas/FromBrochure' }
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [gamme, campagne, choix] }
            ref:
              description: Campagne (Marketing) ; gamme(s) TFBuddy — un identifiant, ou une liste de 1 à 8 gammes dont les produits se cumulent.
              oneOf: [{ type: integer }, { type: array, minItems: 1, maxItems: 8, items: { type: integer } }]
        format: { type: string, enum: [A5, A4], default: A5, description: 'v1.18 — fixe pour un leaflet (A5) et un dépliant (A4) : un autre, 422 `format`.' }
        pageCount: { allOf: [{ $ref: '#/components/schemas/PageCount' }], default: 8 }
        langs: { type: array, items: { type: string, enum: [fr, nl] }, default: [fr] }
        shopIds: { type: array, items: { type: integer }, description: 'Une version par boutique (mar_shop.id).' }
        products: { type: array, maxItems: 400, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/PageRow' }, description: 'Pages intérieures, pageCount − 4 au plus.' }
        offers: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OfferRow' } }
        showAvailability: { type: boolean, description: 'La disponibilité (période, délai de commande) en pied de page (`availabilityFooter`) ; vrai par défaut.' }
    CatalogueUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 160 }
        format: { type: string, enum: [A5, A4] }
        pageCount: { $ref: '#/components/schemas/PageCount' }
        langs: { type: array, items: { type: string, enum: [fr, nl] } }
        shopIds: { type: array, items: { type: integer } }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, items: { $ref: '#/components/schemas/PageRow' } }
        status: { $ref: '#/components/schemas/Status' }
        printQty: { type: [integer, 'null'], minimum: 1 }
        offers: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OfferRow' } }
        showAvailability: { type: boolean, description: 'La disponibilité (période, délai de commande) en pied de page (`availabilityFooter`) ; vrai par défaut.' }
        brochureTemplate: { allOf: [{ $ref: '#/components/schemas/BrochureTemplate' }], description: 'v1.18 — leaflet ou dépliant seulement (un catalogue : 422 « champ inconnu »).' }
        brochureTexts: { allOf: [{ $ref: '#/components/schemas/BrochureTexts' }], description: 'v1.18 — leaflet ou dépliant seulement ; une langue envoyée remplace la sienne, l''autre reste.' }
        gammeBlocks: { type: [array, 'null'], maxItems: 8, uniqueItems: true, items: { type: integer }, description: 'v1.23 — Les blocs, gammes du webshop dans l''ordre du catalogue ; null : retour aux pages libres (les pages restent). Trop de pages : 422 CATALOGUE_PAGES_OVERFLOW.' }
        gammesOk: { type: array, items: { type: integer }, description: 'v1.23 — Les gammes validées dans l''assistant, parmi `gammeBlocks` (sinon 422).' }
        presentations: { type: object, additionalProperties: { oneOf: [{ $ref: '#/components/schemas/Presentation' }, { type: 'null' }] }, description: 'v1.23 — Par identifiant de gamme : la présentation propre au catalogue (images que le catalogue peut prendre) ; null = retirée ; une clé absente reste.' }
    GammeColor: { type: string, enum: ['#2F5D50', '#A3442E', '#B0821A', '#8D1D2C', '#3D5A73', '#78554B', '#6A3B5C', '#5E6B3A', '#8A8278'], description: 'v1.23 — La palette des gammes (sapin, brique, or, rubis, ardoise, Pop-Up, prune, olive, gris).' }
    PresentationText:
      type: object
      additionalProperties: false
      description: 'v1.23 — Un texte d''une présentation ; un champ absent prend son défaut. Titre et accroche : 80 caractères ; texte : 400.'
      properties:
        fr: { type: string }
        nl: { type: string, description: 'Vide : le français, dit (NL_TEXT_MISSING).' }
        font: { type: string, enum: [vank, gotham, playwrite] }
        size: { type: integer, description: 'Points. Titre : 24, 28, 32, 36, 40, 48, 56 ; accroche : 10 à 20 (par 2) ; texte : 8 à 12.' }
        weight: { type: string, enum: [light, regular, medium, bold] }
        color: { type: string, enum: [gamme, rubis, or, encre, creme, blanc], description: 'gamme : la couleur de la gamme.' }
        align: { type: string, enum: [left, center, right] }
    Presentation:
      type: object
      additionalProperties: false
      description: |
        v1.23 — Une page de présentation de gamme (modèle ou celle d'un catalogue), relue dans cet ordre de clés. Défauts :
        une grande photo ; titre Vank 40 pt à la couleur de la gamme ; accroche manuscrite 12 pt ; texte Gotham 9 pt ; fond
        papier. En lecture, chaque photo et le fond portent aussi `image {url, width, height}` (null : image retirée).
      properties:
        layout: { type: string, enum: [une, deux, mosaique, pleine], description: '1 grande · 2 photos · 3 en mosaïque · pleine page.' }
        photos:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [mediaId]
            properties:
              mediaId: { type: integer }
              x: { type: integer, minimum: 0, maximum: 100, default: 50, description: 'Position horizontale du cadrage, en %.' }
              y: { type: integer, minimum: 0, maximum: 100, default: 50 }
              zoom: { type: integer, minimum: 100, maximum: 300, default: 100, description: 'Agrandissement, en %.' }
        title: { $ref: '#/components/schemas/PresentationText' }
        kicker: { $ref: '#/components/schemas/PresentationText' }
        text: { $ref: '#/components/schemas/PresentationText' }
        background:
          type: object
          additionalProperties: false
          properties:
            kind: { type: string, enum: [color, photo] }
            color: { type: string, enum: [papier, gamme-pale, gamme, creme, abricot, blanc] }
            mediaId: { type: [integer, 'null'], description: 'Exigée avec kind photo.' }
            veil: { type: integer, minimum: 0, maximum: 80, default: 40, description: 'Le voile sur la photo, en %.' }
    CatalogueGamme:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: 'Le nom au webshop.' }
        title: { type: string, description: 'Le nom court (sans emoji ni « Gamme »).' }
        color: { $ref: '#/components/schemas/GammeColor' }
        colorSet: { type: boolean }
        presentation: { oneOf: [{ $ref: '#/components/schemas/Presentation' }, { type: 'null' }] }
    FromBrochure:
      type: object
      additionalProperties: false
      required: [campaignId, format]
      description: 'v1.19 — La brochure du générateur d''avant qu''un leaflet ou un dépliant reprend.'
      properties:
        campaignId: { type: integer, minimum: 1 }
        format: { type: string, enum: [leaflet-a5, depliant-a4] }
    CatalogueBrochure:
      type: object
      properties:
        campaignId: { type: integer }
        campaignName: { type: string }
        format: { type: string, enum: [leaflet-a5, depliant-a4] }
        support: { type: [string, 'null'], enum: [leaflet, depliant, null] }
        template: { type: [string, 'null'] }
        productCount: { type: integer, description: Produits cochés dans la brochure. }
        updatedAt: { type: string, format: date-time }
        catalogueId: { type: [integer, 'null'], description: 'Le leaflet ou le dépliant repris ; null : pas encore.' }
    Support: { type: string, enum: [catalogue, leaflet, depliant], default: catalogue, description: 'v1.18 — L''imprimé : un catalogue (8 à 16 pages), un leaflet A5 recto-verso, un dépliant A4 trois volets. Fixé à la création.' }
    BrochureTemplate: { type: string, enum: [papier, fetes, epure, ruby, abricot, noir, duo, carte], default: papier, description: 'v1.18 — Le modèle d''impression d''un leaflet ou d''un dépliant (ceux des brochures).' }
    BrochureTexts:
      type: object
      additionalProperties: false
      description: 'v1.18 — Les textes récrits d''un leaflet ou d''un dépliant, par langue. Vide : rien n''est imprimé ; absent : le texte du document (couverture, dernière page, disponibilité), sinon celui du modèle.'
      properties:
        fr: { $ref: '#/components/schemas/BrochureTextSet' }
        nl: { $ref: '#/components/schemas/BrochureTextSet' }
    BrochureTextSet:
      type: object
      additionalProperties: false
      properties:
        eyebrow: { type: string, maxLength: 400 }
        title: { type: string, maxLength: 400 }
        phrase: { type: string, maxLength: 400 }
        cta: { type: string, maxLength: 400 }
        ctaSub: { type: string, maxLength: 400 }
        innerTitle: { type: string, maxLength: 400 }
        innerSub: { type: string, maxLength: 400 }
        flapTitle: { type: string, maxLength: 400 }
        flapText: { type: string, maxLength: 400 }
        conditions: { type: string, maxLength: 400 }
    ShopCatalogueCreate:
      type: object
      additionalProperties: false
      required: [title, source]
      properties:
        title: { type: string, maxLength: 160 }
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [gamme, choix] }
            ref:
              description: Gamme(s) — un identifiant, ou une liste de 1 à 8 gammes.
              oneOf: [{ type: integer }, { type: array, minItems: 1, maxItems: 8, items: { type: integer } }]
        format: { type: string, enum: [A5, A4] }
        pageCount: { $ref: '#/components/schemas/PageCount' }
        langs: { type: array, items: { type: string, enum: [fr, nl] } }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, items: { $ref: '#/components/schemas/PageRow' } }
        offers: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OfferRow' } }
        showAvailability: { type: boolean, description: 'La disponibilité (période, délai de commande) en pied de page (`availabilityFooter`) ; vrai par défaut.' }
    ShopCatalogueUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 160 }
        format: { type: string, enum: [A5, A4] }
        pageCount: { $ref: '#/components/schemas/PageCount' }
        langs: { type: array, items: { type: string, enum: [fr, nl] } }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, items: { $ref: '#/components/schemas/PageRow' } }
        status: { $ref: '#/components/schemas/Status' }
        printQty: { type: [integer, 'null'] }
        offers: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OfferRow' } }
        showAvailability: { type: boolean, description: 'La disponibilité (période, délai de commande) en pied de page (`availabilityFooter`) ; vrai par défaut.' }
    Catalogue:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        owner: { type: string, enum: [marque, boutique] }
        shop: { type: [object, 'null'], properties: { id: { type: integer }, erpShopId: { type: [integer, 'null'] }, name: { type: string } } }
        source: { type: object, properties: { kind: { type: string }, ref: { type: [string, 'null'], description: Première gamme (compatibilité) }, refs: { type: array, items: { type: string }, description: Toutes les gammes du catalogue }, label: { type: [string, 'null'] } } }
