openapi: 3.1.0
info:
  title: Marketing — catalogues produits
  version: 1.23.0
  description: |
    Les catalogues produits du Marketing (prix du webshop, gammes) : un imprimé A5 (A4 en option)
    de **8 à 16 pages, toujours par 2** (`pageCount` : 8, 10, 12, 14 ou 16). Quatre pages viennent de la Charte des catalogues de la
    marque et sont verrouillées : la couverture (page 1), la page 2, l'avant-dernière et la dernière
    (« commandez en ligne », QR et boutique). Les pages intérieures — 4, 8 ou 12, en nombre fixé par
    le format, de 4 à 12 — sont remplies par catégorie du webshop, dans l'une de trois mises en page
    (`vedette` = 1 + 4, `grille` = 2 × 3, `liste` avec prix).

    v1.1 (novembre 2026, demande du client : « 8, 12 ou 16 pages, dont les pages 1-2 et la dernière et
    l'avant-dernière sont du template du catalogue fait par le franchiseur ») : `pageCount` en
    écriture, `pages` = exactement `pageCount − 4` pages intérieures, pages `brand` au document,
    `page2` et `penultimate` dans la charte, erreur `CATALOGUE_PAGES_NOT_EMPTY`.

    v1.2 (14 novembre 2026, demandes du client : « une page de présentation, seule ou avec liste de
    produits ; chaque gamme a son illustration ; 2-3 possibilités à chaque fois » puis « s'il y a de
    la place, une photo de la médiathèque ou une illustration ») : mises en page `presentation` et
    `presentation_liste` (rattachées à une `gamme`, texte `text` / `textNl` de 400 caractères au
    plus), `template` A · B · C sur toute page intérieure (absent = A), `gamme` sur une page de
    produits (seulement les produits de la gamme), place libre `filler` (`photo` + `fillerMediaId`,
    ou `illustration`) ; répartition automatique d'un catalogue de plusieurs gammes : chaque gamme
    commence par sa page de présentation ; pages `presentation` au document, `template`, `gamme`,
    `drawing`, `room`, `fillable`, `filler` sur les pages de produits ; route
    `…/shops/{shopId}/catalogue-media` (images que la boutique peut prendre) ; `pageCount` = tout nombre
    pair de 8 à 16 (« rajouter une page, c'est toujours par 2 » : + 2 = deux pages intérieures vides en
    fin, − 2 = même règle qu'avant, `CATALOGUE_PAGES_NOT_EMPTY`). Rien n'est rompu : une page
    `{layout, category}` et un catalogue de 8, 12 ou 16 pages restent valables et se lisent comme avant.

    v1.4 (14 novembre 2026, demande du client : « quand je rajoute une catégorie, la catégorie est sur une
    page avec son illustration (2 ou 3 possibilités de montrer le titre et l'illustration) et 3-4
    possibilités de montrer les produits ») : une catégorie = sa page — la répartition automatique donne
    sa page à chaque catégorie (sans la place, même en listes, la dernière page devient « Notre
    sélection » en liste) ; un `PUT` qui change `products` SANS `pages` donne sa page à une catégorie
    ajoutée (ou qui ne tient plus dans les siennes) : une page vide reprise (placée après les siennes),
    sinon `pageCount` + 2 (16 au plus), sinon rien ne bouge et le document le dit
    (`CATEGORY_NO_PAGE`, « plus de place : 16 pages ») ; une catégorie retirée laisse sa page vide.
    `header` d'une page de produits (`titre` défaut · `bandeau` · `grande` ; autre valeur : 422), mise en
    page `mosaique` (grandes vignettes 2 × 2, 4 produits) ; au document, `header` et l'illustration
    (`drawing` / `drawingUrl`) = le dessin de la famille de la catégorie, sinon de la gamme de la page ou
    du catalogue, sinon null ; `headers` dans `catalogue-products` de la boutique. Puis (« la disponibilité
    en dessous de page en footer, par catégorie ») : `availabilityFooter` sur les pages de produits et de
    présentation avec liste — une ligne qui résume la disponibilité de la page ; `availability` reste sur
    chaque produit, mais ne s'imprime plus sous le prix. Puis (« insert picture from médiathèque ») :
    `offers[].mediaId` (image de la médiathèque de la vignette, validée comme la place libre ; 422 sinon),
    `imageUrl` de la vignette au document, alerte `OFFER_MEDIA_MISSING`. Puis (« commencer avec le nom de la gamme et son
    illustration, ensuite catégorie produit (possibilité ou pas en lettres manuscrites), ensuite les
    produits ») : l'en-tête d'une page de produits = la gamme de la page (sinon celle du catalogue que
    portent le plus de ses produits) et son illustration (`gammeTitle`, `drawing`, `gammeImageUrl`), puis la
    catégorie (`title`) en sous-titre ; sans gamme, la catégorie seule et le dessin de sa famille ; `script`
    (booléen, page) met la catégorie en lettres manuscrites ; `familyDrawingUrl`.

    v1.3 (14 novembre 2026, demandes du client : « rajouter les bundles et promotions (via API) et les
    appliquer dans une vignette dans la catégorie », puis « rajouter aussi les données de disponibilité ») :
    `offers` (choix `{type, id, on}` des promotions de TFBuddy — bundle, buyXGetY, quantity,
    scheduledDiscount ; type ou identifiant inconnu : 422) et `showAvailability` (vrai par défaut) en
    écriture et en lecture ; `offers` / `offersError` et `availability` des produits dans
    `catalogue-products` ; au document, une page de produits porte des `DocProduct` ET des `DocOffer`
    (`kind: offer`, une case de la page de sa catégorie) ; un produit porte `oldPriceCents` et `promo`
    (remise programmée) et `availability` (« du 1/12 au 6/12 · sur commande 48 h ») ; alerte
    `PROMOTIONS_UNREADABLE` quand TFBuddy ne rend pas ses promotions (rien n'est alors inventé). Une
    offre absente de `offers` est cochée d'office si elle touche un produit coché. Lues : les quatre
    routes `/api/v1/admin/promotions/{bundles|buy-x-get-y|quantity|scheduled-product-discount}`
    (`status=ACTIVE`, liste puis fiche) et `/api/v1/shops/{id}/scheduled-product-discounts/active`
    pour la version d'une boutique ; gardées 15 minutes (`mar_catalogue_cache`).

    v1.7 (17 novembre 2026, client : « ajouter le poids, ajouter les allergènes — obligatoire », avec leur
    explication sur l'avant-dernière page) : un `DocProduct` (et un produit de `catalogue-products`) porte
    `weightGrams` (single_weight de l'ERP, sinon le poids du nom) et `allergens` (codes de l'annexe II du règlement
    UE 1169/2011, lus dans `grouped_allergens` de `/api/v1/shops/{id}/products/available`, sans les traces) ; la page
    `brand` de l'avant-dernière porte `allergens`, ceux des produits du catalogue, dont elle imprime la légende ;
    alerte `PRODUCT_NO_WEIGHT` pour les produits sans poids. Le rendu (`CataloguePages.tsx`) imprime le poids et les
    pictogrammes sous le nom de chaque produit (vignette et liste).

    v1.8 (17 novembre 2026, client : « une possibilité de produit pleine page, 1 seul produit et sa promotion par
    exemple ») : `layout: pleine` (un produit) et `PageRow.product`, le produit que la page montre seul (seulement avec
    `pleine`, sinon 422 `pages[i].product`). Ce produit est réservé à sa page, et sa promotion avec lui (la première
    vignette `DocOffer` qui le contient) : au document, la page porte le produit puis cette offre, les autres pages ne
    les prennent pas. Sans `product`, la pleine page prend le premier produit de sa catégorie. Un produit choisi absent
    de la version : alerte `PAGE_PRODUCT_MISSING` (le premier de la catégorie est montré, sinon la page reste vide).

    v1.9 (17 novembre 2026, client : « éditer en fonction du design system la typo — Gotham, Vank, Deva — et la couleur
    — abricot, rubis… ») : une couverture de la charte porte `titleFont`, `titleColor`, `subtitleFont`, `subtitleColor`
    (police : vank · gotham · playwrite ; couleur par son nom : rubis · abricot · or · creme · encre · blanc ; null :
    celles du gabarit ; autre valeur : 422 `covers[i].…`). Au document, la page `cover` les porte (la couleur en
    #RRGGBB).
    Même jour (client : « rajouter mail, téléphone 2, QR code de l'adresse directe du webshop, un logo différent par
    magasin ») : la dernière page imprime l'e-mail de la boutique (fiche publique de l'ERP, `DocShop.email`) et ce que
    l'ERP ne porte pas, saisi par boutique (`PUT …/catalogue-shops/{id}` `{phone2, webshopUrl, logoMediaId}`, table
    `mar_catalogue_shop_contact`) : `DocShop.phone2` ; le QR mène au webshop direct de la boutique quand il est saisi
    (sinon celui du réseau, `?shop=`) ; son logo remplace celui de la charte dans ses catalogues (`charter.logoUrl`).

    v1.10 (21 novembre 2026, client : « si je crée un catalogue, je dois pouvoir le modifier ; je ne dois pas modifier
    tout, mais chaque catalogue créé par la marque ») : un catalogue de la marque peut avoir SES pages de la marque
    (`GET / PUT …/catalogues/{id}/brand-pages`) — couverture, page 2, avant-dernière, dernière page — rangées dans ses
    réglages (`settings.brandPages`, sans migration). Une page absente ou null suit la charte publiée ; le document du
    catalogue prend les siennes tout de suite, sans publication, et les autres catalogues ne bougent pas. La copie
    adaptée par une boutique les garde ; un catalogue de boutique n'en a pas à lui (`422`, champ `owner`).
    `Catalogue.brandPagesOwn` : les pages qu'il a à lui.

    v1.11 (21 novembre 2026, client : « je dois pouvoir effacer le Atelier by Halle qui est sur la première page ») :
    une couverture (charte ou page propre d'un catalogue) porte `showShop` (booléen, vrai par défaut) ; faux, la
    version d'une boutique n'imprime plus son nom sous le titre (`eyebrow` null au document). Non booléen : 422
    (`covers[i].showShop`, `cover.showShop`).

    v1.12 (21 novembre 2026, client : « toutes les données du catalogue doivent être éditables — visibles ou pas — + la
    typo et les couleurs ») : chaque page de la marque (charte ou page propre d'un catalogue) porte `look`
    `{élément: {show, font, color}}` — couverture : logo, kicker, title, subtitle (afficher/masquer), kicker (+ police,
    couleur), shop (police, couleur) ; page 2 : logo, title, text ; avant-dernière : logo, title, text, legend ; dernière
    page : logo, title, text, qr, shop (bloc des coordonnées, + police, couleur), address, hours, phone, email. Police :
    vank · gotham · playwrite ; couleur par son nom ; absent : tout affiché, polices et couleurs du gabarit. La
    couverture porte aussi `kickerFr` / `kickerNl` (le texte au-dessus du titre, vide : « La gamme »). Au document, chaque
    page porte `look` (couleur en #RRGGBB) ; un kicker, une légende des allergènes, un QR ou une ligne des coordonnées
    masqués n'y partent pas. Élément inconnu, `show` non booléen, police ou couleur hors de la marque : 422 nommé
    (ex. `cover.look.logo.show`).

    v1.13 (21 novembre 2026, catalogue « Fêtes de fin d'année » : « 24/12 : [horaire] · 25/12 : [horaire]… ») : chaque
    boutique a ses horaires des fêtes (`PUT …/catalogue-shops/{id}` `{holidayHoursFr, holidayHoursNl}`, 600 caractères,
    plusieurs lignes ; migration 054) ; au document, `DocShop.holidayHours` (dans la langue de la version ; NL vide : le
    français), sous les horaires, masquable par l'élément `holidays` de la dernière page. Le texte de la dernière page
    passe à 600 caractères et garde ses retours à la ligne.

    v1.14 (21 novembre 2026, client : « un stopper spécifique pour chaque magasin — photo du magasin, logo du magasin,
    QR (lien spécifique par magasin), heures d'ouverture et de fermeture, QR avec l'adresse (Maps) — à mettre dans les
    catalogues ») : la dernière page prend un gabarit C « Le magasin ». Par boutique (`PUT …/catalogue-shops/{id}`,
    migration 055) : `photoMediaId` (la photo du magasin, une image de la médiathèque du réseau ou de la boutique),
    `mapsUrl` (son lien Google Maps, http/https ; vide : fait de son nom et de son adresse dans l'ERP),
    `openingHoursFr` / `openingHoursNl` (ses horaires, plusieurs lignes ; vides : ceux de l'ERP). La boutique lue
    (`…/catalogue-charter/checks`) rend `photoUrl`, `mapsUrl` (celui qui s'imprime) et `mapsUrlOwn` (le saisi). Au
    document : `DocShop.photoUrl`, `DocShop.mapsUrl`, `DocShop.hours` = les horaires saisis s'il y en a ; éléments
    `photo` et `maps` de la dernière page (masqués : null).

    v1.15 (21 novembre 2026, refonte des pages de la marque — maquettes Claude Design : « le logo de la boutique porte
    déjà son nom ») : la dernière page a un élément `name` (afficher/masquer, vrai par défaut) : le nom de la boutique
    (« L'Atelier By — … ») ; masqué, il ne s'imprime plus, les coordonnées restent. Les `look` déjà enregistrés le
    reçoivent affiché. La vérification « texte trop long » (`…/catalogue-charter/checks`, code `fit`) compte 850 pour
    l'avant-dernière en gabarit A (la légende des allergènes y est un cartouche ; la page 2 garde 1000). Le reste de la
    refonte est la mise en page des gabarits (couverture B, pages 2 et avant-dernière A, dernière page C).

    v1.16 (21 novembre 2026, client : « je dois pouvoir régler les couleurs de typo sur tous les champs ») : prennent une
    police et une couleur, en plus d'afficher/masquer, les éléments de la dernière page `qr` (libellé et adresse du
    webshop), `maps`, `name`, `address`, `hours`, `holidays`, `phone`, `email`, et `legend` à l'avant-dernière ; le `logo`
    de chaque page prend une couleur (le logo détouré en est rempli), pas de police. La photo du magasin reste
    afficher/masquer. Une police donnée à un élément qui n'en prend pas est ignorée (null), comme avant.

    v1.17 (21 novembre 2026, client : « faire la même chose avec le catalogue bureau » — maquettes Claude Design
    export-bureaux ; et « les accents sont abricot » : filets abricot, petits textes à l'accent) :
    - la dernière page (charte ou page propre) porte `qrTarget` (`webshop`, défaut, ou `business` : la page de commande
      entreprise de la boutique) et `qrLabelFr` / `qrLabelNl` (40 caractères ; vides : « Commander en ligne » /
      « Commande entreprise », NL « Bestel online » / « Bestellen voor bedrijven ») ; au document, `qrTarget` et
      `qrLabel` (le saisi, null sinon). En `business`, `qrUrl` est le lien de la boutique ; sans lien (ou en version
      générale) le QR mène au webshop et le document avertit (`BUSINESS_URL_MISSING`) ;
    - par boutique (`PUT …/catalogue-shops/{id}`, migration 056) : `businessUrl` (http/https, 300) et
      `deliveryHoursFr` / `deliveryHoursNl` (la livraison au bureau, 600, plusieurs lignes ; NL vide : le français) ;
      au document `DocShop.deliveryHours`, élément `delivery` de la dernière page (police, couleur ; masqué : vide) ;
    - la charte a une cinquième couleur `colors.rule` (les filets et les tirets des listes, #RRGGBB, abricot #F2C9A0 par
      défaut ; absente d'un PUT : le défaut) ;
    - le dessin `bureau` (« Office Delivery ») rejoint les dessins de couverture (`illustration`), reconnu aussi dans
      un nom de gamme qui contient « bureau » ou « entreprise ».

    v1.18 (21 novembre 2026, fusion des imprimés, étape 2 — client : « fusionner leaflet, brochure et catalogue ») : un
    leaflet A5 recto-verso et un dépliant A4 trois volets sont des catalogues d'un autre support :
    - `support` à la création (`catalogue` défaut, `leaflet`, `depliant` ; autre valeur : 422 `support`) ; le format est
      fixe (leaflet A5, dépliant A4 ; un autre : 422 `format`, à la création comme en `PUT`) ; la marque seule (un
      catalogue de boutique : 422 `support`). Lu sur chaque catalogue (`support`, `catalogue` pour les anciens) ;
    - `brochureTemplate` : le modèle d'impression, l'un de ceux des brochures (`papier` défaut, `fetes`, `epure`, `ruby`,
      `abricot`, `noir`, `duo`, `carte` ; autre : 422) ; `brochureTexts` : les textes récrits par langue
      (`{ fr: { title: "…" }, nl: { … } }`, clés `eyebrow`, `title`, `phrase`, `cta`, `ctaSub`, `innerTitle`, `innerSub`,
      `flapTitle`, `flapText`, `conditions`, 400 caractères ; une langue envoyée remplace la sienne ; vide = rien
      d'imprimé ; clé absente = le texte du document). Les deux en `PUT` d'un leaflet ou d'un dépliant seulement (un
      catalogue : 422 « champ inconnu ») ; null sur un catalogue ;
    - le document d'un leaflet ou d'un dépliant : couverture, page 2, UNE page de produits (tous les produits cochés, dans
      l'ordre des catégories ; ses `pages` de catalogue ne servent pas), avant-dernière, dernière ; pas de
      `CATEGORY_NO_PAGE` ; `PRODUCTS_OVERFLOW` et `PAGES_EMPTY` dits pour le support. L'écran l'imprime au format de la
      brochure (6 produits au plus sur un leaflet, 9 sur un dépliant) ;
    - le dashboard franchisé (`…/brand-catalogues`) ne reçoit que des catalogues : un leaflet ou un dépliant n'y va pas
      (404 sur le sien).

    v1.23 (27 novembre 2026, la construction « gamme par gamme », maquettes M1 · M2 · M3 validées) :
    - un catalogue peut se ranger en BLOCS : `gammeBlocks` (liste ordonnée de 1 à 8 gammes du webshop ; null = les pages
      libres d'avant, le défaut — un catalogue existant ne change pas). Le catalogue s'imprime alors : pages 1-2 de la
      marque · les produits HORS GAMME (ceux d'aucune gamme des blocs, sans présentation) · pour chaque gamme, sa page
      de présentation sur une page de GAUCHE (paire) puis les pages de ses catégories, la première en face (impaire) ;
      une page libre (`{layout: grille, category: null}`, photo ou illustration) s'intercale quand le compte ne tombe pas
      juste · des pages libres jusqu'aux deux dernières pages. Le total reste pair, 8 à 16 ; le catalogue grandit par 2
      quand il le faut ; au-delà, 422 `CATALOGUE_PAGES_OVERFLOW` (un détail par bloc). Un `pageCount` envoyé trop petit :
      le même 422 ;
    - en mode blocs, une page porte (gamme, catégorie) et ne prend QUE les produits de cette catégorie qui sont dans
      cette gamme (un produit de deux gammes du catalogue paraît dans chacune) ; une page sans gamme, les produits hors
      gamme ; « Notre sélection » (page libre) ce qui n'a de place nulle part, en dernier ; une présentation avec liste,
      les produits de sa gamme restés sans page de sa gamme ;
    - `PUT` : `gammeBlocks` (ajouter, retirer, réordonner : les pages se refont en gardant les mises en page de chaque
      (gamme, catégorie) ; une gamme qui arrive part du modèle de sa présentation) ; `pages` (rangées par blocs, l'ordre
      des catégories d'un bloc gardé) ; `pages: []` (« Répartir automatiquement » dans l'ordre des blocs) ; `gammesOk`
      (les gammes validées dans l'assistant, parmi les blocs) ; `presentations` (`{ "<gamme>": Presentation | null }` :
      la présentation propre au catalogue, null = retirée) ;
    - `GET …/catalogue-gammes` : les gammes du webshop, leur COULEUR (réglée une fois pour toutes, sinon celle de la
      palette des gammes, `colorSet` faux) et le MODÈLE de leur présentation (null : pas de modèle) ; `PUT
      …/catalogue-gammes/{id}` `{color?, presentation?}` (couleur de `GammeColor`, null = celle par défaut ; modèle
      avec des images du réseau seulement ; null = retiré). Marque seule ; 404 gamme inconnue ; 422 nommé ;
    - au document, une page `presentation` porte `design` (null : la présentation d'avant, gabarits A · B · C) : photos
      (adresse, cadrage `x`/`y` en %, `zoom` en %), titre, accroche, texte (le texte dans la langue — le néerlandais vide :
      le français, dit `NL_TEXT_MISSING` —, police, taille en points, graisse, couleur #RRGGBB, alignement), fond
      (couleur, photo et voile), `gammeColor` ; `title` et `text` de la page suivent le design. Avertissement
      `PRESENTATION_PHOTO_MISSING`. Champs ajoutés : un client qui les ignore imprime l'ancienne présentation.

    v1.21 (26 novembre 2026, client : « je ne vois pas toutes les catégories » — les galettes des rois) :
    `catalogue-products` (marque et boutique) rend aussi `offWebshopCategories` [{name, nameNl, products}], dans cet
    ordre de clés : les familles du catalogue du Marketing (repris de l'ERP) dont AUCUN produit n'est sur le webshop des
    boutiques lues (comparées produit par produit, par identifiant ERP ; une famille qui porte le nom d'une catégorie lue
    au webshop n'y figure pas ; B2B exclu). L'écran les nomme, grisées, sans pouvoir les ajouter. Champ ajouté : rien ne
    change pour un client qui l'ignore.

    v1.20 (25 novembre 2026, le bon de commande — client : « A – E1 – conditions par magasin – contenu exact de ce qu'il
    y a dans le catalogue », puis « cadre vide à remplir, délai boutique sous chaque catégorie ») :
    - `GET …/catalogues/{id}/order-form?lang=&shopId=` (marque) · `GET …/shops/{shopId}/catalogues/{id}/order-form?lang=`
      et `…/brand-catalogues/{id}/order-form?lang=` (boutique) · `GET /api/v1/public/marketing/catalogue-prints/{token}/order-form?lang=`
      (page publique ; `lang` : l'autre langue du même catalogue) : le bon de commande d'une version, composé À PARTIR
      de son document — catégories = pages produits au même titre (« gamme — catégorie », `pages`), produits une fois
      chacun à leur prix (remise programmée et sa période), offres (contenu, période « du … au … »), pied de chaque
      catégorie (disponibilité du catalogue, délai le plus long du catalogue et de la boutique), cadre des conditions
      de la boutique (`configured: false` : vide, à remplir), libellés fixes FR / NL ;
    - `GET|PUT …/shops/{shopId}/order-conditions` (boutique) : ses conditions, une fois pour tous ses bons
      (`minDelay {value, unit: hours|days}`, `depositPct`, `holidayDeadlines [{for, until}]`, `pickup`,
      `delivery {enabled, radiusKm, feeCents}`, `note {fr, nl}`) ; `GET …/catalogue-order-conditions` (marque, lecture
      seule, paginée).

    v1.19 (21 novembre 2026, fusion des imprimés, étape 3 — reprise des brochures du générateur d'avant) :
    - `GET …/catalogue-brochures` : les brochures enregistrées des campagnes (`mar_campaign_brochure`), paginées, les plus
      récentes d'abord — campagne, format, support qu'elles deviennent, modèle, produits cochés, date, et `catalogueId`
      (le leaflet ou le dépliant qu'on en a repris ; null : pas encore). Marque seule (403) ;
    - à la création, `fromBrochure: {campaignId, format}` reprend une brochure : `support` doit suivre son format
      (`leaflet-a5` → `leaflet`, `depliant-a4` → `depliant`), la source est sa campagne (`{kind: campagne, ref}`) et la
      campagne doit avoir des réglages pour ce format ; sinon 422 `fromBrochure`. Rejouée, la création rend le catalogue
      déjà repris (200, rien de nouveau). Lu sur chaque catalogue (`fromBrochure`, null sinon) ;
    - `brochureTexts` accepté à la création d'un leaflet ou d'un dépliant (un catalogue : 422 `brochureTexts`).
    Les routes des brochures (`…/campaigns/{id}/brochures`) ne changent pas : l'ancien générateur reste lisible.

    v1.5 (15 novembre 2026, client : « les deux, garde les 3 gabarits, code-le » — assistant des pages de la
    marque, maquettes A1-A4 ; assistant du franchisé, maquettes B1-B4) :
    - la charte a un BROUILLON (`GET|PUT …/catalogue-charter`, que l'assistant enregistre tout seul) et des
      VERSIONS PUBLIÉES (`…/catalogue-charter/publications` : POST publie le brouillon — ou `fromVersion`, revenir à
      une version —, GET l'historique). Les catalogues lisent la dernière version publiée ; « Marquer imprimé »
      (état `imprime`, ou `…/prints` d'une boutique) FIGE la version de ce catalogue (`charterVersion`). Un PUT de
      la charte ne change donc plus les catalogues : il faut publier. La charte d'avant est la version 1
      (migration 050). `…/catalogue-charter/checks` : « Avant de publier », les boutiques (ce que la dernière page
      imprime pour chacune, ce qui manque), les catalogues concernés.
    - gabarits : couverture `template` A (pleine couleur) · B (illustration) · C (photo), `visual`
      `illustration | media | none` (null : comme avant), `illustration` (dessin de saison) ; page 2 et
      avant-dernière `template` A (texte seul) · B (image en haut) · C (image en bas) ; dernière page `template`
      A (QR et boutique) · B (boutique en avant). Au document : `template`, `kicker`, `drawing` sur la couverture,
      `template` sur `brand` et `back`, `charter.version`.
    - boutique : `…/catalogues/{id}/checks` (points de vérification calculés, `seen`), `…/checks/{code}` (PUT
      `{seen}`), `…/prints` (POST `{quantity}`), `…/public-links` (GET le lien permanent, POST un nouveau — l'ancien
      est révoqué) ; les mêmes sous `…/brand-catalogues/{id}/…` pour un catalogue de la marque préparé pour la
      boutique (`GET …/brand-catalogues`, `…/{id}`, `…/{id}/document`, PUT `…/{id}/reception` `{status: pris}`,
      POST `…/{id}/adaptations`, POST `…/{id}/print-links`) ; page publique `…/public/marketing/catalogue-links/{token}`
      (le catalogue en ligne, dernière version, sans session).

    Premier contrat OpenAPI du module (docs/API_REGISTRY.md, §3, écart 16) : il ne couvre que ces
    routes, écrites au standard (enveloppe `{success, data, meta}`, camelCase, montants en centimes,
    dates ISO 8601 UTC, pagination, codes d'erreur du catalogue §7.2).

    Trois familles :
    - `/api/v1/marketing/…` : l'écran « Catalogues » de la marque (session de l'ERP, rôle réseau) ;
    - `/api/v1/integration/marketing/shops/{shopId}/…` : le dashboard magasin du cockpit (portail
      Pilotage réseau), jeton de service `erp_jeton_service` (en-tête `X-Service-Token`) ; la boutique
      est celle du chemin, toutes les contraintes sont appliquées par le serveur ;
    - `/api/v1/public/marketing/catalogue-prints/{token}` : le document d'un lien d'impression signé ;
      `/api/v1/public/marketing/catalogue-links/{token}` : le catalogue en ligne (lien permanent, révocable).
servers:
  - url: /marketing
    description: Le module, servi sous /marketing (l'adresse vient de la configuration du client).
tags:
  - name: Catalogues (marque)
  - name: Catalogues (boutique, entre portails)
  - name: Impression
  - name: Bon de commande

paths:
  /api/v1/marketing/catalogues:
    get:
      tags: [Catalogues (marque)]
      summary: Liste des catalogues (marque et franchisés)
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/sort'
        - { name: 'filter[owner][eq]', in: query, schema: { type: string, enum: [marque, boutique] } }
        - { name: 'filter[status][eq]', in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: 'filter[shop][eq]', in: query, schema: { type: integer }, description: Identifiant de boutique du module. }
      responses:
        '200': { $ref: '#/components/responses/CatalogueList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalogues (marque)]
      summary: Crée un catalogue de la marque
      description: |
        `source.kind` : `gamme` (les produits du webshop de la ou des gammes `ref` sont cochés),
        `campagne` (les produits ERP de l'offre de la campagne `ref`, ses boutiques comme versions)
        ou `choix` (`products`). `pageCount` : 8 (défaut), 10, 12, 14 ou 16. Sans `pages` (ou `pages: []`), les
        `pageCount − 4` pages intérieures sont réparties automatiquement par catégorie ; une liste plus
        courte est complétée de pages vides, une plus longue refusée (422 `VALIDATION_FAILED`, champ `pages`).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogueCreate' }
      responses:
        '200': { $ref: '#/components/responses/Catalogue', description: 'v1.19 — `fromBrochure` d''une brochure déjà reprise : le catalogue qui en est fait (rien de nouveau).' }
        '201': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-brochures:
    get:
      tags: [Catalogues (marque)]
      summary: Les brochures enregistrées des campagnes (générateur d'avant), et le leaflet ou le dépliant repris de chacune
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/perPage' }]
      responses:
        '200':
          description: Paginé, les plus récentes d'abord.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/CatalogueBrochure' } }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogues/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Catalogues (marque)]
      summary: Un catalogue
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Catalogues (marque)]
      summary: Modifie un catalogue
      description: |
        Les champs présents remplacent les actuels. `pages` vide = répartition automatique sur
        exactement `pageCount − 4` pages ; plus courte = complétée de pages vides ; plus longue = 422.

        Changer `pageCount` sans envoyer `pages` : en augmentant, des pages vides s'ajoutent à la fin ;
        en réduisant, seules des pages de la fin SANS produit sont retirées. Si une page à retirer porte
        des produits : `422 CATALOGUE_PAGES_NOT_EMPTY` (une ligne `details` par page, `pages[i]`) et rien
        n'est écrit — renvoyer `pageCount` avec `pages` (la liste voulue, ou `[]` pour répartir).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogueUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Catalogues (marque)]
      summary: Supprime un catalogue
      security: [{ session: [] }]
      responses:
        '204': { description: Supprimé. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogues/{id}/document:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Catalogues (marque), Impression]
      summary: Une version mise en pages (générale ou d'une boutique)
      security: [{ session: [] }]
      parameters:
        - { name: shopId, in: query, schema: { type: integer }, description: 'Boutique de la version (mar_shop.id) ; absente : version générale.' }
        - { name: lang, in: query, schema: { type: string, enum: [fr, nl], default: fr } }
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogues/{id}/brand-pages:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Catalogues (marque)]
      summary: v1.10 — Les 4 pages de la marque du catalogue (celles de la charte qu'il lit, et les siennes)
      description: |
        `common` : les pages de la charte PUBLIÉE que le catalogue lit (la version figée s'il est imprimé ; sa
        couverture par la règle du document : la première de ses gammes qui en a une, sinon la générique, titrée du nom
        de la gamme). `own` : les siennes, ou null page par page quand il suit la charte. `gamme` : la gamme de sa
        couverture.
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/BrandPages' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    put:
      tags: [Catalogues (marque)]
      summary: v1.10 — Les pages de la marque propres à ce catalogue de la marque
      description: |
        Remplace les pages propres du catalogue : chaque clé porte la page entière, ou null (ou absente) pour suivre
        la charte publiée ; `{}` le remet entièrement sur la charte. Validé comme la charte (mêmes champs, mêmes
        gabarits, `422` au champ nommé, ex. `cover.titleFr`). Pas de publication : le document du catalogue les prend
        tout de suite ; les autres catalogues ne bougent pas. Un catalogue de boutique : `422` (champ `owner`).
        Idempotent. Réponse : comme le GET.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandPagesWrite' }
      responses:
        '200': { $ref: '#/components/responses/BrandPages' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-products:
    get:
      tags: [Catalogues (marque)]
      summary: Le catalogue du webshop, avec le prix de chaque boutique
      security: [{ session: [] }]
      parameters:
        - { name: shopIds, in: query, schema: { type: string, example: '3,4' }, description: 'Boutiques (mar_shop.id) ; vide : toutes celles qui ont une caisse.' }
        - { name: relire, in: query, schema: { type: string, enum: ['1'] }, description: 'Relit le webshop, les gammes et les promotions tout de suite au lieu de la lecture gardée 30 min (« ↻ Relire le webshop »).' }
      responses:
        '200': { $ref: '#/components/responses/WebshopProducts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-charter:
    get:
      tags: [Catalogues (marque)]
      summary: La Charte des catalogues
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/Charter' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Catalogues (marque)]
      summary: Remplace la Charte des catalogues
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharterWrite' }
      responses:
        '200': { $ref: '#/components/responses/Charter' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-charter/checks:
    get:
      tags: [Catalogues (marque)]
      summary: « Avant de publier » — points vérifiés, boutiques, catalogues concernés
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/Generic' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-shops/{id}:
    put:
      tags: [Catalogues (marque)]
      summary: v1.9 — Ce qu'une boutique imprime en plus à la dernière page (second téléphone, webshop direct, logo)
      description: |
        L'ERP ne porte ni second téléphone, ni adresse directe du webshop de la boutique, ni logo à elle : ils se
        saisissent ici, par boutique (`mar_shop.id`). Un champ absent garde sa valeur ; « » (ou `null` pour le logo)
        l'efface. Réponse : la boutique telle que `…/catalogue-charter/checks` la rend (`shops[]`).
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                phone2: { type: string, maxLength: 40, pattern: '^[0-9+().\/ -]*$' }
                webshopUrl: { type: string, maxLength: 300, description: 'http:// ou https:// ; « » : le webshop du réseau.' }
                logoMediaId: { type: [integer, 'null'], description: 'Une image de la médiathèque, du réseau ou de cette boutique, pas archivée ; null : le logo de la charte.' }
                holidayHoursFr: { type: string, maxLength: 600, description: 'v1.13 — Les horaires des fêtes de la boutique, plusieurs lignes ; « » : rien.' }
                holidayHoursNl: { type: string, maxLength: 600, description: 'v1.13 — « » : le français est imprimé.' }
                photoMediaId: { type: [integer, 'null'], description: 'v1.14 — La photo du magasin (gabarit C) : une image de la médiathèque, du réseau ou de cette boutique ; null : aucune.' }
                mapsUrl: { type: string, maxLength: 500, description: 'v1.14 — Lien Google Maps (http/https) ; « » : fait du nom et de l’adresse de l’ERP.' }
                openingHoursFr: { type: string, maxLength: 600, description: 'v1.14 — Horaires d’ouverture, plusieurs lignes ; « » : ceux de l’ERP.' }
                openingHoursNl: { type: string, maxLength: 600, description: 'v1.14 — « » : le français.' }
                businessUrl: { type: string, maxLength: 300, description: 'v1.17 — Lien de commande entreprise (http/https), le QR du catalogue « Bureaux » ; « » : le webshop.' }
                deliveryHoursFr: { type: string, maxLength: 600, description: 'v1.17 — La livraison au bureau, plusieurs lignes ; « » : rien.' }
                deliveryHoursNl: { type: string, maxLength: 600, description: 'v1.17 — « » : le français.' }
      responses:
        '200': { $ref: '#/components/responses/Generic' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-gammes:
    get:
      tags: [Catalogues (marque)]
      summary: v1.23 — Les gammes du webshop pour les catalogues — couleur et modèle de la présentation
      description: |
        Toutes les gammes actives du webshop en une page (une dizaine) ; la pagination est rendue pour la forme. `color` :
        la couleur réglée (`colorSet` vrai) ou celle que la palette des gammes lui donne d'office (sa saison, sinon tirée
        de son identifiant). `presentation` : le modèle de sa page de présentation, que reprend la présentation d'un
        catalogue où la gamme arrive ; null : pas de modèle.
      security: [{ session: [] }]
      responses:
        '200':
          description: Les gammes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/CatalogueGamme' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-gammes/{id}:
    put:
      tags: [Catalogues (marque)]
      summary: v1.23 — La couleur d'une gamme et le modèle de sa page de présentation
      description: |
        Un champ absent garde sa valeur. `color` : une couleur de la palette des gammes (`GammeColor`), null = celle par
        défaut. `presentation` : le modèle (images de la médiathèque du RÉSEAU, pas archivées), null = retiré. Réponse : la
        gamme telle que `GET …/catalogue-gammes` la rend. Les catalogues déjà faits gardent leur présentation à eux.
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                color: { oneOf: [{ $ref: '#/components/schemas/GammeColor' }, { type: 'null' }] }
                presentation: { oneOf: [{ $ref: '#/components/schemas/Presentation' }, { type: 'null' }] }
      responses:
        '200': { $ref: '#/components/responses/Generic' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-charter/publications:
    get:
      tags: [Catalogues (marque)]
      summary: Les versions publiées de la charte, la plus récente d'abord
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/perPage' }]
      responses:
        '200': { $ref: '#/components/responses/Generic' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalogues (marque)]
      summary: « Publier pour tous les catalogues » (le brouillon, ou `fromVersion`)
      security: [{ session: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fromVersion: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { $ref: '#/components/responses/Generic' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogue-products:
    parameters: [{ $ref: '#/components/parameters/shopId' }]
    get:
      tags: [Catalogues (boutique, entre portails)]
      summary: Ce que la boutique vend au webshop, à SES prix
      security: [{ serviceToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/ShopProducts' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogue-media:
    parameters: [{ $ref: '#/components/parameters/shopId' }]
    get:
      tags: [Catalogues (boutique, entre portails)]
      summary: Les images de la médiathèque que la boutique peut mettre dans la place libre d'une page
      description: |
        Celles du réseau (sans boutique) et les siennes ; ni archivées, ni vidéos ; les plus récentes
        d'abord. Le même périmètre est vérifié à l'écriture de `fillerMediaId` (422 sinon).
      security: [{ serviceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
        - { name: 'filter[name][like]', in: query, schema: { type: string, maxLength: 80 }, description: Mots du nom, de la catégorie ou du produit. }
      responses:
        '200':
          description: Les images, paginées.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, description: 'À envoyer en `fillerMediaId`.' }
                            name: { type: string }
                            url: { type: string, description: Adresse absolue (version web). }
                            thumbnailUrl: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalogues (boutique, entre portails)]
      summary: Importer une photo dans la médiathèque de la boutique
      description: |
        15/11/2026 (« dans le catalogue, je dois pouvoir changer ou importer de la médiathèque une photo ou une
        illustration pour les bundles ou les promotions »). L'image entre dans la médiathèque, rangée à la boutique
        du chemin (source `cockpit`) : elle la retrouve dans la liste ci-dessus, pour la place libre d'une page
        (`fillerMediaId`) ou la vignette d'une promotion (`offers[].mediaId`). Une image seulement (PNG, JPEG, GIF,
        WebP, AVIF), 5 Mo au plus. Le même fichier déjà déposé n'est pas recopié : il est rendu (200).
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentBase64]
              properties:
                name: { type: string, maxLength: 120, description: 'Le nom de la photo (défaut : « Photo de la boutique »).' }
                contentBase64: { type: string, description: 'Le fichier, en base64 (un préfixe data:… est accepté).' }
      responses:
        '201':
          description: Photo importée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          url: { type: string }
                          thumbnailUrl: { type: [string, 'null'] }
                          duplicate: { type: boolean }
        '200': { description: 'Le même fichier était déjà dans la médiathèque de la boutique (ou du réseau) : il est rendu, sans copie.' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogues:
    parameters: [{ $ref: '#/components/parameters/shopId' }]
    get:
      tags: [Catalogues (boutique, entre portails)]
      summary: Les catalogues de la boutique (les siens seulement)
      security: [{ serviceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/sort'
        - { name: 'filter[status][eq]', in: query, schema: { $ref: '#/components/schemas/Status' } }
      responses:
        '200': { $ref: '#/components/responses/CatalogueList' }
        '401': { $ref: '#/components/responses/Error' }
