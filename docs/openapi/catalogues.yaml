      tags: [Catalogues (boutique, entre portails)]
      summary: Crée un catalogue de la boutique
      description: |
        Contraintes du serveur : `source.kind` ∈ `gamme | choix` ; produits vendus par la boutique
        seulement (`422 CATALOGUE_PRODUCT_NOT_SOLD` sinon, produit par produit) ; aucun prix, aucune
