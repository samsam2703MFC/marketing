components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mar_session
      description: Session ouverte par les identifiants de l'ERP (réseau seul).
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Jeton de service entre portails (`erp_jeton_service` d'erp_cles).

  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    shopId: { name: shopId, in: path, required: true, schema: { type: integer }, description: Identifiant de caisse ERP de la boutique. }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    perPage: { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    sort: { name: sort, in: query, schema: { type: string, enum: [updatedAt, -updatedAt, createdAt, -createdAt, title, -title], default: -updatedAt } }

  responses:
    Unauthenticated:
      description: Sans identité (forme commune du routeur du module, §3.2 du registre).
      content:
        application/json:
          schema: { type: object, properties: { status: { type: string }, description: { type: string } } }
    Error:
      description: Erreur au format du standard.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Catalogue:
      description: Un catalogue.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Catalogue' } } }
    CatalogueList:
      description: Une page de catalogues.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Catalogue' } } } }
    Document:
      description: Une version mise en pages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Document' } } }
    WebshopProducts:
      description: Le webshop des boutiques.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/WebshopProducts' } } }
    ShopProducts:
      description: Le webshop d'une boutique, à ses prix.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            nameNl: { type: string }
                            imageUrl: { type: [string, 'null'] }
                            categoryId: { type: [integer, 'null'] }
                            gammes: { type: array, items: { type: integer } }
                            priceCents: { type: [integer, 'null'], description: Prix du webshop de la boutique (à défaut son prix au comptoir). }
                            shopPriceCents: { type: [integer, 'null'], description: Prix au comptoir (pour signaler un écart). }
                            availability: { $ref: '#/components/schemas/Availability' }
                      offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
                      offersError: { type: [string, 'null'] }
                      categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
                      gammes: { type: array, items: { $ref: '#/components/schemas/Gamme' } }
                      shops: { type: array, items: { $ref: '#/components/schemas/ShopRead' } }
                      layouts: { type: array, items: { $ref: '#/components/schemas/Layout' } }
                      templates: { type: array, items: { $ref: '#/components/schemas/Template' } }
                      headers: { type: array, items: { $ref: '#/components/schemas/Header' } }
                      fillers: { type: array, items: { type: string, enum: [photo, illustration] } }
                      pageCounts: { type: array, items: { $ref: '#/components/schemas/PageCount' } }
    Charter:
      description: La Charte des catalogues.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Charter' } } }

  schemas:
    EnvelopeOk:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            pagination:
              type: object
              properties: { page: { type: integer }, perPage: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    EnvelopeError:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, AUTH_TOKEN_MISSING, AUTH_TOKEN_INVALID, PERM_ROLE_REQUIRED, RESOURCE_NOT_FOUND, DEPENDENCY_UNAVAILABLE, CATALOGUE_PRODUCT_NOT_SOLD, CATALOGUE_PAGES_NOT_EMPTY]
            message: { type: string }
            details: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
        meta: { type: object, properties: { requestId: { type: string } } }
    Status: { type: string, enum: [brouillon, pret, imprime] }
    PageCount: { type: integer, enum: [8, 10, 12, 14, 16], description: 'Pages du catalogue, toujours un nombre pair de 8 à 16 (« rajouter une page, c''est toujours par 2 »), dont 4 de la marque (1, 2, avant-dernière, dernière). Autre valeur : 422.' }
    Layout: { type: string, enum: [vedette, grille, liste, mosaique, presentation, presentation_liste], description: 'vedette : 1 + 4 produits ; grille : 2 × 3 ; liste : 12 avec prix ; mosaique : grandes vignettes 2 × 2 (4 produits) ; presentation : la page d''une gamme (illustration, nom, texte), sans produit ; presentation_liste : la même avec les 8 premiers produits de la gamme et leurs prix.' }
    Header: { type: string, enum: [titre, bandeau, grande], description: 'En-tête d''une page de produits et illustration de sa catégorie : titre (titre et petit pictogramme, le défaut) · bandeau (bandeau de la couleur principale, illustration en blanc) · grande (grande illustration en haut de page, puis le titre). Indépendant du gabarit.' }
    Template: { type: string, enum: [A, B, C], description: 'Variante de gabarit. Pages de produits : A classique (fond papier, titre centré), B bandeau (bandeau de la couleur principale), C épuré (fond blanc, titre à gauche). Présentations : A illustration, B pleine couleur, C photo pleine.' }
    DocFiller:
      type: [object, 'null']
      description: La place libre d'une page de produits, remplie (null sinon, ou quand la page est pleine).
      properties:
        kind: { type: string, enum: [photo, illustration] }
        imageUrl: { type: [string, 'null'], description: Photo de la médiathèque (ou de la gamme quand elle n'a pas de dessin). }
        drawing: { type: [string, 'null'], description: 'Dessin livré avec le module, chemin relatif (img/print/noel.png, img/croissant.png).' }
        drawingUrl: { type: [string, 'null'], description: Le même, en adresse absolue. }
    ProductRow:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: integer, description: Identifiant du produit dans TFBuddy (webshop). }
        'on': { type: boolean, default: true }
    PageRow:
      type: object
      additionalProperties: false
      required: [layout]
      properties:
        layout: { $ref: '#/components/schemas/Layout' }
        category: { type: [integer, 'null'], description: 'Catégorie du webshop ; null : « Notre sélection » (les suivants, toutes catégories). Ignorée (rangée null) pour une présentation.' }
        template: { $ref: '#/components/schemas/Template' }
        gamme: { type: [integer, 'null'], description: 'Gamme du webshop (active) : obligatoire pour une présentation ; sur une page de produits, seulement les produits de cette gamme.' }
        text: { type: string, maxLength: 400, description: 'Texte d''une présentation (ignoré ailleurs) ; vide = rien.' }
        textNl: { type: string, maxLength: 400, description: 'Le même en néerlandais ; vide = le français, dit (NL_TEXT_MISSING).' }
        filler: { type: [string, 'null'], enum: [photo, illustration, null], description: 'Place libre d''une page de produits pas pleine (ignorée sur une présentation).' }
        fillerMediaId: { type: [integer, 'null'], description: 'Avec `filler: photo` : une image de la médiathèque, pas archivée ; pour une boutique, du réseau ou d''elle-même.' }
        header: { $ref: '#/components/schemas/Header' }
        script: { type: boolean, default: false, description: 'La catégorie en lettres manuscrites (police de la marque) ; autre valeur que booléen : 422. Rangé seulement quand vrai.' }
    CatalogueCreate:
      type: object
      additionalProperties: false
      required: [title, source]
      properties:
        title: { type: string, maxLength: 160 }
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [gamme, campagne, choix] }
