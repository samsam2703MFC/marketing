openapi: 3.1.0
info:
  title: Marketing — catalogues produits
  version: 1.2.0
  description: |
    Les catalogues produits du Marketing (prix du webshop, gammes) : un imprimé A5 (A4 en option)
    de **8 à 16 pages, toujours par 2** (`pageCount` : 8, 10, 12, 14 ou 16). Quatre pages viennent de la Charte des catalogues de la
    marque et sont verrouillées : la couverture (page 1), la page 2, l'avant-dernière et la dernière
    (« commandez en ligne », QR et boutique). Les pages intérieures — 4, 8 ou 12, en nombre fixé par
    le format, de 4 à 12 — sont remplies par catégorie du webshop, dans l'une de trois mises en page
    (`vedette` = 1 + 4, `grille` = 2 × 3, `liste` avec prix).

    v1.1 (novembre 2026, demande du client : « 8, 12 ou 16 pages, dont les pages 1-2 et la dernière et
    l'avant-dernière sont du template du catalogue fait par le franchiseur ») : `pageCount` en
    écriture, `pages` = exactement `pageCount − 4` pages intérieures, pages `brand` au document,
    `page2` et `penultimate` dans la charte, erreur `CATALOGUE_PAGES_NOT_EMPTY`.

    v1.2 (14 novembre 2026, demandes du client : « une page de présentation, seule ou avec liste de
    produits ; chaque gamme a son illustration ; 2-3 possibilités à chaque fois » puis « s'il y a de
    la place, une photo de la médiathèque ou une illustration ») : mises en page `presentation` et
    `presentation_liste` (rattachées à une `gamme`, texte `text` / `textNl` de 400 caractères au
    plus), `template` A · B · C sur toute page intérieure (absent = A), `gamme` sur une page de
    produits (seulement les produits de la gamme), place libre `filler` (`photo` + `fillerMediaId`,
    ou `illustration`) ; répartition automatique d'un catalogue de plusieurs gammes : chaque gamme
    commence par sa page de présentation ; pages `presentation` au document, `template`, `gamme`,
    `drawing`, `room`, `fillable`, `filler` sur les pages de produits ; route
    `…/shops/{shopId}/catalogue-media` (images que la boutique peut prendre) ; `pageCount` = tout nombre
    pair de 8 à 16 (« rajouter une page, c'est toujours par 2 » : + 2 = deux pages intérieures vides en
    fin, − 2 = même règle qu'avant, `CATALOGUE_PAGES_NOT_EMPTY`). Rien n'est rompu : une page
    `{layout, category}` et un catalogue de 8, 12 ou 16 pages restent valables et se lisent comme avant.

    Premier contrat OpenAPI du module (docs/API_REGISTRY.md, §3, écart 16) : il ne couvre que ces
    routes, écrites au standard (enveloppe `{success, data, meta}`, camelCase, montants en centimes,
    dates ISO 8601 UTC, pagination, codes d'erreur du catalogue §7.2).

    Trois familles :
    - `/api/v1/marketing/…` : l'écran « Catalogues » de la marque (session de l'ERP, rôle réseau) ;
    - `/api/v1/integration/marketing/shops/{shopId}/…` : le dashboard magasin du cockpit (portail
      Pilotage réseau), jeton de service `erp_jeton_service` (en-tête `X-Service-Token`) ; la boutique
      est celle du chemin, toutes les contraintes sont appliquées par le serveur ;
    - `/api/v1/public/marketing/catalogue-prints/{token}` : le document d'un lien d'impression signé.
servers:
  - url: /marketing
    description: Le module, servi sous /marketing (l'adresse vient de la configuration du client).
tags:
  - name: Catalogues (marque)
  - name: Catalogues (boutique, entre portails)
  - name: Impression

paths:
  /api/v1/marketing/catalogues:
    get:
      tags: [Catalogues (marque)]
      summary: Liste des catalogues (marque et franchisés)
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/sort'
        - { name: 'filter[owner][eq]', in: query, schema: { type: string, enum: [marque, boutique] } }
        - { name: 'filter[status][eq]', in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: 'filter[shop][eq]', in: query, schema: { type: integer }, description: Identifiant de boutique du module. }
      responses:
        '200': { $ref: '#/components/responses/CatalogueList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalogues (marque)]
      summary: Crée un catalogue de la marque
      description: |
        `source.kind` : `gamme` (les produits du webshop de la ou des gammes `ref` sont cochés),
        `campagne` (les produits ERP de l'offre de la campagne `ref`, ses boutiques comme versions)
        ou `choix` (`products`). `pageCount` : 8 (défaut), 10, 12, 14 ou 16. Sans `pages` (ou `pages: []`), les
        `pageCount − 4` pages intérieures sont réparties automatiquement par catégorie ; une liste plus
        courte est complétée de pages vides, une plus longue refusée (422 `VALIDATION_FAILED`, champ `pages`).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogueCreate' }
      responses:
        '201': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogues/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Catalogues (marque)]
      summary: Un catalogue
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Catalogues (marque)]
      summary: Modifie un catalogue
      description: |
        Les champs présents remplacent les actuels. `pages` vide = répartition automatique sur
        exactement `pageCount − 4` pages ; plus courte = complétée de pages vides ; plus longue = 422.

        Changer `pageCount` sans envoyer `pages` : en augmentant, des pages vides s'ajoutent à la fin ;
        en réduisant, seules des pages de la fin SANS produit sont retirées. Si une page à retirer porte
        des produits : `422 CATALOGUE_PAGES_NOT_EMPTY` (une ligne `details` par page, `pages[i]`) et rien
        n'est écrit — renvoyer `pageCount` avec `pages` (la liste voulue, ou `[]` pour répartir).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogueUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Catalogues (marque)]
      summary: Supprime un catalogue
      security: [{ session: [] }]
      responses:
        '204': { description: Supprimé. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogues/{id}/document:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Catalogues (marque), Impression]
      summary: Une version mise en pages (générale ou d'une boutique)
      security: [{ session: [] }]
      parameters:
        - { name: shopId, in: query, schema: { type: integer }, description: 'Boutique de la version (mar_shop.id) ; absente : version générale.' }
        - { name: lang, in: query, schema: { type: string, enum: [fr, nl], default: fr } }
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-products:
    get:
      tags: [Catalogues (marque)]
      summary: Le catalogue du webshop, avec le prix de chaque boutique
      security: [{ session: [] }]
      parameters:
        - { name: shopIds, in: query, schema: { type: string, example: '3,4' }, description: 'Boutiques (mar_shop.id) ; vide : toutes celles qui ont une caisse.' }
      responses:
        '200': { $ref: '#/components/responses/WebshopProducts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/marketing/catalogue-charter:
    get:
      tags: [Catalogues (marque)]
      summary: La Charte des catalogues
      security: [{ session: [] }]
      responses:
        '200': { $ref: '#/components/responses/Charter' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Catalogues (marque)]
      summary: Remplace la Charte des catalogues
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharterWrite' }
      responses:
        '200': { $ref: '#/components/responses/Charter' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogue-products:
    parameters: [{ $ref: '#/components/parameters/shopId' }]
    get:
      tags: [Catalogues (boutique, entre portails)]
      summary: Ce que la boutique vend au webshop, à SES prix
      security: [{ serviceToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/ShopProducts' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogue-media:
    parameters: [{ $ref: '#/components/parameters/shopId' }]
    get:
      tags: [Catalogues (boutique, entre portails)]
      summary: Les images de la médiathèque que la boutique peut mettre dans la place libre d'une page
      description: |
        Celles du réseau (sans boutique) et les siennes ; ni archivées, ni vidéos ; les plus récentes
        d'abord. Le même périmètre est vérifié à l'écriture de `fillerMediaId` (422 sinon).
      security: [{ serviceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
        - { name: 'filter[name][like]', in: query, schema: { type: string, maxLength: 80 }, description: Mots du nom, de la catégorie ou du produit. }
      responses:
        '200':
          description: Les images, paginées.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, description: 'À envoyer en `fillerMediaId`.' }
                            name: { type: string }
                            url: { type: string, description: Adresse absolue (version web). }
                            thumbnailUrl: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogues:
    parameters: [{ $ref: '#/components/parameters/shopId' }]
    get:
      tags: [Catalogues (boutique, entre portails)]
      summary: Les catalogues de la boutique (les siens seulement)
      security: [{ serviceToken: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/sort'
        - { name: 'filter[status][eq]', in: query, schema: { $ref: '#/components/schemas/Status' } }
      responses:
        '200': { $ref: '#/components/responses/CatalogueList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalogues (boutique, entre portails)]
      summary: Crée un catalogue de la boutique
      description: |
        Contraintes du serveur : `source.kind` ∈ `gamme | choix` ; produits vendus par la boutique
        seulement (`422 CATALOGUE_PRODUCT_NOT_SOLD` sinon, produit par produit) ; aucun prix, aucune
        couverture, aucune autre boutique dans le corps (champ inconnu → 422) ; trois mises en page.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopCatalogueCreate' }
      responses:
        '201': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogues/{id}:
    parameters: [{ $ref: '#/components/parameters/shopId' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [Catalogues (boutique, entre portails)]
      summary: Un catalogue de la boutique (404 pour celui d'une autre boutique ou de la marque)
      security: [{ serviceToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Catalogues (boutique, entre portails)]
      summary: Modifie un catalogue de la boutique (mêmes contraintes)
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopCatalogueUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Catalogue' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Catalogues (boutique, entre portails)]
      summary: Supprime un catalogue de la boutique
      security: [{ serviceToken: [] }]
      responses:
        '204': { description: Supprimé. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogues/{id}/document:
    parameters: [{ $ref: '#/components/parameters/shopId' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [Catalogues (boutique, entre portails), Impression]
      summary: Le catalogue mis en pages (sa version, à ses prix)
      security: [{ serviceToken: [] }]
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [fr, nl], default: fr } }
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/integration/marketing/shops/{shopId}/catalogues/{id}/print-links:
    parameters: [{ $ref: '#/components/parameters/shopId' }, { $ref: '#/components/parameters/id' }]
    post:
      tags: [Catalogues (boutique, entre portails), Impression]
      summary: Un lien signé (48 h) vers la page d'impression du Marketing
      description: |
        La page (`{MAR_PUBLIC_BASE_URL}/catalogue/?t=…`) compose les pages avec les polices de la marque
        et ouvre la fenêtre d'impression du navigateur : « Enregistrer au format PDF » donne le fichier
        (même moteur que les brochures).
      security: [{ serviceToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { lang: { type: string, enum: [fr, nl], default: fr } }
      responses:
        '201':
          description: Lien créé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [url, token, expiresAt]
                        properties:
                          url: { type: string, example: 'https://bo.example/marketing/catalogue/?t=Mz…' }
                          token: { type: string }
                          expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/public/marketing/catalogue-prints/{token}:
    get:
      tags: [Impression]
      summary: Le document d'un lien d'impression valable
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mar_session
      description: Session ouverte par les identifiants de l'ERP (réseau seul).
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Jeton de service entre portails (`erp_jeton_service` d'erp_cles).

  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    shopId: { name: shopId, in: path, required: true, schema: { type: integer }, description: Identifiant de caisse ERP de la boutique. }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    perPage: { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    sort: { name: sort, in: query, schema: { type: string, enum: [updatedAt, -updatedAt, createdAt, -createdAt, title, -title], default: -updatedAt } }

  responses:
    Unauthenticated:
      description: Sans identité (forme commune du routeur du module, §3.2 du registre).
      content:
        application/json:
          schema: { type: object, properties: { status: { type: string }, description: { type: string } } }
    Error:
      description: Erreur au format du standard.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Catalogue:
      description: Un catalogue.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Catalogue' } } }
    CatalogueList:
      description: Une page de catalogues.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Catalogue' } } } }
    Document:
      description: Une version mise en pages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Document' } } }
    WebshopProducts:
      description: Le webshop des boutiques.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/WebshopProducts' } } }
    ShopProducts:
      description: Le webshop d'une boutique, à ses prix.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            nameNl: { type: string }
                            imageUrl: { type: [string, 'null'] }
                            categoryId: { type: [integer, 'null'] }
                            gammes: { type: array, items: { type: integer } }
                            priceCents: { type: [integer, 'null'], description: Prix du webshop de la boutique (à défaut son prix au comptoir). }
                            shopPriceCents: { type: [integer, 'null'], description: Prix au comptoir (pour signaler un écart). }
                      categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
                      gammes: { type: array, items: { $ref: '#/components/schemas/Gamme' } }
                      shops: { type: array, items: { $ref: '#/components/schemas/ShopRead' } }
                      layouts: { type: array, items: { $ref: '#/components/schemas/Layout' } }
                      templates: { type: array, items: { $ref: '#/components/schemas/Template' } }
                      fillers: { type: array, items: { type: string, enum: [photo, illustration] } }
                      pageCounts: { type: array, items: { $ref: '#/components/schemas/PageCount' } }
    Charter:
      description: La Charte des catalogues.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - { type: object, properties: { data: { $ref: '#/components/schemas/Charter' } } }

  schemas:
    EnvelopeOk:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            pagination:
              type: object
              properties: { page: { type: integer }, perPage: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    EnvelopeError:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, AUTH_TOKEN_MISSING, AUTH_TOKEN_INVALID, PERM_ROLE_REQUIRED, RESOURCE_NOT_FOUND, DEPENDENCY_UNAVAILABLE, CATALOGUE_PRODUCT_NOT_SOLD, CATALOGUE_PAGES_NOT_EMPTY]
            message: { type: string }
            details: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
        meta: { type: object, properties: { requestId: { type: string } } }
    Status: { type: string, enum: [brouillon, pret, imprime] }
    PageCount: { type: integer, enum: [8, 10, 12, 14, 16], description: 'Pages du catalogue, toujours un nombre pair de 8 à 16 (« rajouter une page, c''est toujours par 2 »), dont 4 de la marque (1, 2, avant-dernière, dernière). Autre valeur : 422.' }
    Layout: { type: string, enum: [vedette, grille, liste, presentation, presentation_liste], description: 'vedette : 1 + 4 produits ; grille : 2 × 3 ; liste : 12 avec prix ; presentation : la page d''une gamme (illustration, nom, texte), sans produit ; presentation_liste : la même avec les 8 premiers produits de la gamme et leurs prix.' }
    Template: { type: string, enum: [A, B, C], description: 'Variante de gabarit. Pages de produits : A classique (fond papier, titre centré), B bandeau (bandeau de la couleur principale), C épuré (fond blanc, titre à gauche). Présentations : A illustration, B pleine couleur, C photo pleine.' }
    DocFiller:
      type: [object, 'null']
      description: La place libre d'une page de produits, remplie (null sinon, ou quand la page est pleine).
      properties:
        kind: { type: string, enum: [photo, illustration] }
        imageUrl: { type: [string, 'null'], description: Photo de la médiathèque (ou de la gamme quand elle n'a pas de dessin). }
        drawing: { type: [string, 'null'], description: 'Dessin livré avec le module, chemin relatif (img/print/noel.png, img/croissant.png).' }
        drawingUrl: { type: [string, 'null'], description: Le même, en adresse absolue. }
    ProductRow:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: integer, description: Identifiant du produit dans TFBuddy (webshop). }
        'on': { type: boolean, default: true }
    PageRow:
      type: object
      additionalProperties: false
      required: [layout]
      properties:
        layout: { $ref: '#/components/schemas/Layout' }
        category: { type: [integer, 'null'], description: 'Catégorie du webshop ; null : « Notre sélection » (les suivants, toutes catégories). Ignorée (rangée null) pour une présentation.' }
        template: { $ref: '#/components/schemas/Template' }
        gamme: { type: [integer, 'null'], description: 'Gamme du webshop (active) : obligatoire pour une présentation ; sur une page de produits, seulement les produits de cette gamme.' }
        text: { type: string, maxLength: 400, description: 'Texte d''une présentation (ignoré ailleurs) ; vide = rien.' }
        textNl: { type: string, maxLength: 400, description: 'Le même en néerlandais ; vide = le français, dit (NL_TEXT_MISSING).' }
        filler: { type: [string, 'null'], enum: [photo, illustration, null], description: 'Place libre d''une page de produits pas pleine (ignorée sur une présentation).' }
        fillerMediaId: { type: [integer, 'null'], description: 'Avec `filler: photo` : une image de la médiathèque, pas archivée ; pour une boutique, du réseau ou d''elle-même.' }
    CatalogueCreate:
      type: object
      additionalProperties: false
      required: [title, source]
      properties:
        title: { type: string, maxLength: 160 }
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [gamme, campagne, choix] }
            ref:
              description: Campagne (Marketing) ; gamme(s) TFBuddy — un identifiant, ou une liste de 1 à 8 gammes dont les produits se cumulent.
              oneOf: [{ type: integer }, { type: array, minItems: 1, maxItems: 8, items: { type: integer } }]
        format: { type: string, enum: [A5, A4], default: A5 }
        pageCount: { allOf: [{ $ref: '#/components/schemas/PageCount' }], default: 8 }
        langs: { type: array, items: { type: string, enum: [fr, nl] }, default: [fr] }
        shopIds: { type: array, items: { type: integer }, description: 'Une version par boutique (mar_shop.id).' }
        products: { type: array, maxItems: 400, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/PageRow' }, description: 'Pages intérieures, pageCount − 4 au plus.' }
    CatalogueUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 160 }
        format: { type: string, enum: [A5, A4] }
        pageCount: { $ref: '#/components/schemas/PageCount' }
        langs: { type: array, items: { type: string, enum: [fr, nl] } }
        shopIds: { type: array, items: { type: integer } }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, items: { $ref: '#/components/schemas/PageRow' } }
        status: { $ref: '#/components/schemas/Status' }
        printQty: { type: [integer, 'null'], minimum: 1 }
    ShopCatalogueCreate:
      type: object
      additionalProperties: false
      required: [title, source]
      properties:
        title: { type: string, maxLength: 160 }
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [gamme, choix] }
            ref:
              description: Gamme(s) — un identifiant, ou une liste de 1 à 8 gammes.
              oneOf: [{ type: integer }, { type: array, minItems: 1, maxItems: 8, items: { type: integer } }]
        format: { type: string, enum: [A5, A4] }
        pageCount: { $ref: '#/components/schemas/PageCount' }
        langs: { type: array, items: { type: string, enum: [fr, nl] } }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, items: { $ref: '#/components/schemas/PageRow' } }
    ShopCatalogueUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 160 }
        format: { type: string, enum: [A5, A4] }
        pageCount: { $ref: '#/components/schemas/PageCount' }
        langs: { type: array, items: { type: string, enum: [fr, nl] } }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, items: { $ref: '#/components/schemas/PageRow' } }
        status: { $ref: '#/components/schemas/Status' }
        printQty: { type: [integer, 'null'] }
    Catalogue:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        owner: { type: string, enum: [marque, boutique] }
        shop: { type: [object, 'null'], properties: { id: { type: integer }, erpShopId: { type: [integer, 'null'] }, name: { type: string } } }
        source: { type: object, properties: { kind: { type: string }, ref: { type: [string, 'null'], description: Première gamme (compatibilité) }, refs: { type: array, items: { type: string }, description: Toutes les gammes du catalogue }, label: { type: [string, 'null'] } } }
        format: { type: string, enum: [A5, A4] }
        status: { $ref: '#/components/schemas/Status' }
        printQty: { type: [integer, 'null'] }
        langs: { type: array, items: { type: string } }
        shopIds: { type: array, items: { type: integer } }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRow' } }
        pages: { type: array, items: { $ref: '#/components/schemas/PageRow' }, description: 'Les pageCount − 4 pages intérieures (un catalogue d’avant les formats est complété de pages vides).' }
        productCount: { type: integer }
        pageCount: { $ref: '#/components/schemas/PageCount' }
        innerPageCount: { type: integer, enum: [4, 8, 12], description: 'pageCount − 4.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category: { type: object, properties: { id: { type: integer }, name: { type: string }, nameNl: { type: string } } }
    Gamme: { type: object, properties: { id: { type: integer }, name: { type: string }, image: { type: [string, 'null'] }, from: { type: [string, 'null'] }, to: { type: [string, 'null'] } } }
    ShopRead: { type: object, properties: { id: { type: integer }, erpShopId: { type: [integer, 'null'] }, name: { type: string }, products: { type: integer }, error: { type: [string, 'null'] }, readAt: { type: [string, 'null'] } } }
    WebshopProducts:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              nameNl: { type: string }
              imageUrl: { type: [string, 'null'] }
              categoryId: { type: [integer, 'null'] }
              gammes: { type: array, items: { type: integer } }
              prices: { type: array, items: { type: object, properties: { shopId: { type: integer }, webPriceCents: { type: [integer, 'null'] }, shopPriceCents: { type: [integer, 'null'] } } } }
              priceCents: { type: [integer, 'null'], description: Prix du webshop le plus répandu parmi les boutiques. }
              priceDiffers: { type: array, items: { type: integer }, description: Boutiques qui ont un autre prix. }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        gammes: { type: array, items: { $ref: '#/components/schemas/Gamme' } }
        shops: { type: array, items: { $ref: '#/components/schemas/ShopRead' } }
    DocProduct:
      type: object
      properties: { id: { type: integer }, name: { type: string }, imageUrl: { type: [string, 'null'] }, priceCents: { type: [integer, 'null'] }, currency: { type: string, const: EUR } }
    Document:
      type: object
      properties:
        catalogue: { type: object, properties: { id: { type: integer }, title: { type: string }, format: { type: string }, owner: { type: string }, pageCount: { $ref: '#/components/schemas/PageCount' } } }
        version:
          type: object
          properties:
            lang: { type: string, enum: [fr, nl] }
            shop: { $ref: '#/components/schemas/DocShop' }
        charter:
          type: object
          properties:
            logoUrl: { type: [string, 'null'], description: 'null : le logo de la marque fourni avec la page.' }
            colors: { $ref: '#/components/schemas/Colors' }
        pages:
          type: array
          items:
            oneOf:
              - type: object
                description: Couverture (charte, verrouillée).
                properties: { kind: { const: cover }, locked: { const: true }, title: { type: string }, subtitle: { type: string }, eyebrow: { type: [string, 'null'] }, imageUrl: { type: [string, 'null'] } }
              - type: object
                description: Page 2 (`slot` page2) ou avant-dernière page (`slot` penultimate) — charte, verrouillées.
                properties: { kind: { const: brand }, locked: { const: true }, slot: { type: string, enum: [page2, penultimate] }, title: { type: string }, text: { type: string, description: Paragraphes séparés par une ligne vide ; lignes par un saut de ligne. }, imageUrl: { type: [string, 'null'] } }
              - type: object
                description: Page intérieure (une page sans produit a `products` vide).
                properties:
                  kind: { const: products }
                  locked: { const: false }
                  layout: { $ref: '#/components/schemas/Layout' }
                  template: { $ref: '#/components/schemas/Template' }
                  category: { type: [integer, 'null'] }
                  gamme: { type: [integer, 'null'] }
                  title: { type: string, description: 'La catégorie, sinon le nom de la gamme, sinon « Notre sélection ».' }
                  drawing: { type: [string, 'null'], description: Dessin de la gamme de la page, rappelé dans l'en-tête. }
                  drawingUrl: { type: [string, 'null'] }
                  room: { type: integer, description: Places libres (capacité − produits). }
                  fillable: { type: boolean, description: 'Une rangée entière au moins est libre : la place libre peut être remplie.' }
                  filler: { $ref: '#/components/schemas/DocFiller' }
                  products: { type: array, items: { $ref: '#/components/schemas/DocProduct' } }
              - type: object
                description: Page de présentation d'une gamme (illustration — photo de sa couverture dans la charte, sinon du webshop, sinon son dessin de saison, sinon un cadre sobre —, nom, texte, et au choix ses premiers produits).
                properties:
                  kind: { const: presentation }
                  locked: { const: false }
                  layout: { type: string, enum: [presentation, presentation_liste] }
                  template: { $ref: '#/components/schemas/Template' }
                  gamme: { type: integer }
                  title: { type: string }
                  text: { type: string }
                  imageUrl: { type: [string, 'null'] }
                  drawing: { type: [string, 'null'] }
                  drawingUrl: { type: [string, 'null'] }
                  products: { type: array, items: { $ref: '#/components/schemas/DocProduct' } }
              - type: object
                description: Dernière page (charte, verrouillée).
                properties: { kind: { const: back }, locked: { const: true }, title: { type: string }, text: { type: string }, qrUrl: { type: [string, 'null'] }, host: { type: [string, 'null'] }, shop: { $ref: '#/components/schemas/DocShop' } }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [WEBSHOP_UNREADABLE, PRICE_DIFFERS, PRODUCT_NO_PRICE, PRODUCT_NOT_SOLD, PRODUCTS_OVERFLOW, PAGES_EMPTY, PAGES_OVER_FORMAT, NL_TEXT_MISSING, SHOP_ADDRESS_MISSING, WEBSHOP_URL_UNKNOWN, GAMME_UNKNOWN, GAMME_NO_ILLUSTRATION, FILLER_MEDIA_MISSING, FILLER_NO_ILLUSTRATION] }
              message: { type: string }
    DocShop:
      type: [object, 'null']
      properties: { id: { type: integer }, erpShopId: { type: [integer, 'null'] }, name: { type: string }, address: { type: string }, hours: { type: string }, phone: { type: string } }
    Colors:
      type: object
      properties: { primary: { type: string }, secondary: { type: string }, accent: { type: string }, ink: { type: string } }
    Cover:
      type: object
      additionalProperties: false
      required: [titleFr]
      properties:
        gamme: { type: [integer, 'null'], description: 'Gamme du webshop ; null : couverture générique.' }
        titleFr: { type: string, maxLength: 240 }
        titleNl: { type: string, maxLength: 240 }
        subtitleFr: { type: string, maxLength: 240 }
        subtitleNl: { type: string, maxLength: 240 }
        mediaId: { type: [integer, 'null'], description: Visuel de la médiathèque. }
    CharterWrite:
      type: object
      additionalProperties: false
      properties:
        logoMediaId: { type: [integer, 'null'] }
        colors: { $ref: '#/components/schemas/Colors' }
        covers: { type: array, items: { $ref: '#/components/schemas/Cover' } }
        back:
          type: object
          additionalProperties: false
          properties: { titleFr: { type: string }, titleNl: { type: string }, textFr: { type: string }, textNl: { type: string } }
        page2: { $ref: '#/components/schemas/BrandPage' }
        penultimate: { $ref: '#/components/schemas/BrandPage' }
    BrandPage:
      type: object
      additionalProperties: false
      description: 'Page 2 ou avant-dernière page de tous les catalogues. Absente du PUT : celle enregistrée reste. Titre ou texte français obligatoire.'
      properties:
        titleFr: { type: string, maxLength: 240 }
        titleNl: { type: string, maxLength: 240 }
        textFr: { type: string, maxLength: 1200, description: Paragraphes séparés par une ligne vide. }
        textNl: { type: string, maxLength: 1200 }
        mediaId: { type: [integer, 'null'], description: Image de la médiathèque. }
    Charter:
      allOf:
        - $ref: '#/components/schemas/CharterWrite'
        - type: object
          properties:
            logoUrl: { type: [string, 'null'] }
            page2: { type: object, properties: { imageUrl: { type: [string, 'null'] } } }
            penultimate: { type: object, properties: { imageUrl: { type: [string, 'null'] } } }
            updatedAt: { type: [string, 'null'], format: date-time }
