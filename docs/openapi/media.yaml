openapi: 3.1.0
info:
  title: Marketing — médiathèque commune
  version: 1.1.0
  description: |
    La médiathèque commune du marketing : une seule réserve de photos et de vidéos pour les posts et
    les publicités (module Social), les visuels de campagne, les brochures, les catalogues, les bâches,
    les affiches — et les écrans des magasins (régie d'affichage, dépôt `signage`). Réservée au réseau :
    une identité de boutique reçoit `403`. Contrat détaillé : `docs/API_REGISTRY.md` §9.

    v1.0 (novembre 2026) : liste paginée et filtrée, dépôt idempotent (empreinte SHA-256), fiche,
    modification des classements, retrait, couverture d'une vidéo.

    v1.1 (17 novembre 2026, demandes du client : « la possibilité de taguer les images », retenues « 1 et 2 »
    de la maquette `docs/maquettes/mediatheque/` — les étiquettes sur la fiche, les étiquettes proposées à
    valider —, « avec des rectangles au coin arrondi », puis « un assistant d'import en lot avec la
    proposition des tags ») :
    - la fiche porte `tags` (`moments`, `usages`, `products`, `free`), `validUntil`, `format` (lu dans la
      taille, carré à 5 % près) et `pendingProposals` ; `PATCH` accepte `moments`, `usages`, `products`,
      `freeTags`, `validUntil` — chaque famille envoyée remplace la précédente, et la choisir à la main
      tranche ses propositions en attente ; ces champs ne sont pas acceptés au dépôt (`POST`) ;
    - filtres `filter[moment|usage|product|tag|format|valid][eq]` (ce que la régie d'affichage demande),
      la recherche par nom cherche aussi dans les étiquettes ;
    - `media-tag-proposals` : les étiquettes proposées (produit d'après le nom du webshop, moment d'après le
      rayon, saison, détourée), chacune avec d'après quoi elle est faite. Rien ne s'applique sans ✓ ; un ✕
      la garde refusée, elle ne revient pas ; `counts.proposals` dans `media-library`.

    Moments : ceux de la régie d'affichage (`signage` : matin, midi, aprem) — `apres-midi` ici. Aucun moment =
    toute la journée.
servers:
  - url: /api/v1/marketing
security:
  - session: []
  - serviceToken: []

paths:
  /media-library:
    get:
      summary: Catégories, saisons, compteurs et limites de dépôt
      responses:
        '200':
          description: Les références de la médiathèque.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
                          seasons: { type: array, items: { $ref: '#/components/schemas/Ref' } }
                          counts:
                            type: object
                            properties:
                              all: { type: integer }
                              uncategorized: { type: integer }
                              archived: { type: integer }
                              proposals: { type: integer, description: Étiquettes proposées en attente d'un ✓ ou d'un ✕. }
                          limits: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }

  /media-assets:
    get:
      summary: Une page de la médiathèque
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, -createdAt, updatedAt, -updatedAt, name, -name, bytes, -bytes], default: -createdAt } }
        - { name: 'filter[kind][eq]', in: query, schema: { type: string, enum: [image, video] } }
        - { name: 'filter[category][eq]', in: query, schema: { type: string } }
        - { name: 'filter[category][isNull]', in: query, schema: { type: boolean } }
        - { name: 'filter[subcategory][eq]', in: query, schema: { type: string } }
        - { name: 'filter[season][eq]', in: query, schema: { type: string } }
        - { name: 'filter[offerItem][eq]', in: query, schema: { type: integer } }
        - { name: 'filter[shop][eq]', in: query, schema: { type: integer } }
        - { name: 'filter[source][eq]', in: query, schema: { type: string, enum: [marketing, social] } }
        - { name: 'filter[archived][eq]', in: query, schema: { type: boolean } }
        - { name: 'filter[name][contains]', in: query, schema: { type: string, maxLength: 100 }, description: 'Chaque mot dans le nom, la catégorie, le produit ou une étiquette.' }
        - { name: 'filter[moment][eq]', in: query, schema: { $ref: '#/components/schemas/Moment' } }
        - { name: 'filter[usage][eq]', in: query, schema: { $ref: '#/components/schemas/Usage' } }
        - { name: 'filter[product][eq]', in: query, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' }, description: Identifiant du produit du webshop (ERP). }
        - { name: 'filter[tag][eq]', in: query, schema: { type: string, maxLength: 40 }, description: 'Étiquette libre (le « # » est ignoré).' }
        - { name: 'filter[format][eq]', in: query, schema: { $ref: '#/components/schemas/Format' } }
        - { name: 'filter[valid][eq]', in: query, schema: { type: boolean }, description: '`true` : sans fin de validité ou pas encore passée ; `false` : passée.' }
      responses:
        '200':
          description: La page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Dépose un fichier (idempotent)
      description: |
        Le fichier en corps brut (classements en query) ou du JSON `{content, poster?, name?, category?, subcategory?,
        season?, offerItemId?, shopId?, cutout?, source?}`. Les étiquettes se posent ensuite par `PATCH`.
      responses:
        '201': { $ref: '#/components/responses/Media' }
        '200': { $ref: '#/components/responses/Media' }
        '422': { $ref: '#/components/responses/Error' }

  /media-assets/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      summary: Une fiche
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Nom, classements, étiquettes, retrait
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                category: { type: [string, 'null'] }
                subcategory: { type: [string, 'null'] }
                season: { type: [string, 'null'] }
                offerItemId: { type: [integer, 'null'] }
                shopId: { type: [integer, 'null'] }
                cutout: { type: boolean }
                archived: { type: boolean }
                moments: { type: array, items: { $ref: '#/components/schemas/Moment' }, description: Remplace la famille ; vide = toute la journée. }
                usages: { type: array, items: { $ref: '#/components/schemas/Usage' } }
                products:
                  type: array
                  maxItems: 8
                  items: { $ref: '#/components/schemas/ProductRef' }
                freeTags: { type: array, maxItems: 12, items: { type: string, maxLength: 41 }, description: 'Sans « # », mises en minuscules.' }
                validUntil: { type: [string, 'null'], format: date }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Retire le fichier (idempotent ; le fichier reste servi)
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/Error' }

  /media-assets/{id}/thumbnail:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      summary: La couverture d'une vidéo (image en corps brut ou `{content}`)
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '422': { $ref: '#/components/responses/Error' }

  /media-tag-proposals:
    get:
      summary: Les fichiers qui ont des étiquettes proposées en attente, chacun avec les siennes
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { name: 'filter[media][eq]', in: query, schema: { type: integer }, description: Les propositions d'une fiche. }
      responses:
        '200':
          description: 'La page (`meta.proposals` : propositions en attente, tous fichiers confondus).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            media: { $ref: '#/components/schemas/MediaAsset' }
                            proposals: { type: array, items: { $ref: '#/components/schemas/Proposal' } }
                      meta: { type: object, properties: { proposals: { type: integer } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Enregistre des propositions
      description: |
        Tout ou rien à la lecture (422 champ par champ). Ce qui est déjà appliqué — un moment ou un produit sur la
        fiche, la même valeur d'usage, une saison, le détourage — et ce qui a déjà été proposé (en attente,
        accepté ou refusé) est passé (`skipped`). `201` si au moins une est nouvelle, `200` sinon (idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required: [mediaId, family, value, reason]
                    properties:
                      mediaId: { type: integer }
                      family: { $ref: '#/components/schemas/ProposalFamily' }
                      value: { type: string, description: 'moment, usage, code de saison, id du produit du webshop, ou 1 (détourée)' }
                      label: { type: string, maxLength: 200, description: Le nom du produit (obligatoire pour `produit`). }
                      reason: { type: string, minLength: 1, maxLength: 200, description: D'après quoi. }
      responses:
        '201': { $ref: '#/components/responses/ProposalResult' }
        '200': { $ref: '#/components/responses/ProposalResult' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    patch:
      summary: « Tout accepter », ou le ✓ / ✕ d'une ligne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids, status]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer } }
                status: { type: string, enum: [accepted, refused] }
      responses:
        '200':
          description: '`updated` : tranchées ici (les déjà tranchées sont passées) ; `proposals` : encore en attente.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties: { data: { type: object, properties: { updated: { type: integer }, proposals: { type: integer } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /media-tag-proposals/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      summary: ✓ (appliquée à la fiche) ou ✕ (refusée, elle ne revient pas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [accepted, refused] }
      responses:
        '200':
          description: La proposition et la fiche relue. La même décision redonnée est sans effet.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeOk'
                  - properties:
                      data:
                        type: object
                        properties:
                          proposal: { $ref: '#/components/schemas/Proposal' }
                          media: { $ref: '#/components/schemas/MediaAsset' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mar_session
      description: Session ouverte par les identifiants de l'ERP (réseau seul).
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Jeton de service entre portails (`erp_jeton_service` d'erp_cles) — le module Social.

  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    perPage: { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }

  responses:
    Unauthenticated:
      description: Sans identité (forme commune du routeur du module, §3.2 du registre).
      content:
        application/json:
          schema: { type: object, properties: { status: { type: string }, description: { type: string } } }
    Error:
      description: Erreur au format du standard.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Media:
      description: Une fiche (`meta.duplicate` au dépôt).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - properties: { data: { $ref: '#/components/schemas/MediaAsset' } }
    ProposalResult:
      description: '`created` nouvelles, `skipped` passées, `proposals` en attente en tout.'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeOk'
              - properties: { data: { type: object, properties: { created: { type: integer }, skipped: { type: integer }, proposals: { type: integer } } } }

  schemas:
    EnvelopeOk:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
            duplicate: { type: boolean }
            pagination:
              type: object
              properties: { page: { type: integer }, perPage: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    EnvelopeError:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string, enum: [VALIDATION_FAILED, PERM_ROLE_REQUIRED, RESOURCE_NOT_FOUND, RESOURCE_STATE_INVALID] }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
        meta: { type: object, properties: { requestId: { type: string } } }
    Ref:
      type: object
      properties: { code: { type: string }, label: { type: string } }
    Category:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        files: { type: integer }
        subcategories: { type: array, items: { type: object, properties: { code: { type: string }, label: { type: string }, files: { type: integer } } } }
    Moment: { type: string, enum: [matin, midi, apres-midi] }
    Usage: { type: string, enum: [ecrans, reseaux, catalogue, webshop, affiche] }
    Format: { type: string, enum: [carre, portrait, paysage] }
    ProposalFamily: { type: string, enum: [produit, moment, saison, usage, detouree] }
    ProductRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]{0,18}$', description: Identifiant du produit du webshop (ERP). }
        name: { type: string, maxLength: 200, description: 'Son nom, tel que le webshop le donne.' }
    MediaAsset:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        name: { type: string }
        url: { type: string, format: uri }
        thumbnailUrl: { type: [string, 'null'], format: uri }
        webUrl: { type: string, format: uri }
        path: { type: string }
        mimeType: { type: string }
        bytes: { type: integer }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        format: { oneOf: [{ $ref: '#/components/schemas/Format' }, { type: 'null' }], description: 'Lu dans la taille, jamais stocké.' }
        category: { oneOf: [{ $ref: '#/components/schemas/Ref' }, { type: 'null' }] }
        subcategory: { oneOf: [{ $ref: '#/components/schemas/Ref' }, { type: 'null' }] }
        season: { oneOf: [{ $ref: '#/components/schemas/Ref' }, { type: 'null' }] }
        offerItem: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        shop: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        cutout: { type: boolean }
        tags:
          type: object
          properties:
            moments: { type: array, items: { $ref: '#/components/schemas/Moment' } }
            usages: { type: array, items: { $ref: '#/components/schemas/Usage' } }
            products: { type: array, items: { $ref: '#/components/schemas/ProductRef' } }
            free: { type: array, items: { type: string } }
        validUntil: { type: [string, 'null'], format: date }
        pendingProposals: { type: integer }
        source: { type: string, enum: [marketing, social] }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Proposal:
      type: object
      properties:
        id: { type: string }
        mediaId: { type: string }
        family: { $ref: '#/components/schemas/ProposalFamily' }
        value: { type: string }
        label: { type: string }
        reason: { type: string, description: '« nom du webshop », « catégorie Viennoiserie → matin »…' }
        status: { type: string, enum: [proposed, accepted, refused] }
        createdAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
